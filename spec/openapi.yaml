  /v1/vaults/{id}/index:
    parameters:
      - name: id
        in: path
        required: true
        description: The vault's id, a UUIDv7. Another form is refused with `invalid_id`.
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getVaultIndex
      tags:
        - Vaults
      summary: Read a vault's index chart.
      description: 'Index points from `from` to `to` at the given grain. The grain `minute` is allowed only for ranges of two days or less. A point with `stale: true` is drawn as a gap. The index is not streamed; the page polls every 60 seconds.'
      x-owner: '12'
      x-scope: public
      x-rate-class: public
      x-idempotency: none
      x-flag: screens.vaults
      x-refusals:
        - feature_unavailable
        - not_found
        - invalid_request
      security: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Instant'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Instant'
        - name: grain
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/VaultGrain'
      responses:
        '200':
          description: The points, oldest first, or a refusal.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - ok
                      - data
                    properties:
                      ok:
                        const: true
                      data:
                        $ref: '#/components/schemas/VaultIndex'
                  - $ref: '#/components/schemas/Refusal'
              example:
                ok: true
                data:
                  points:
                    - at: '2026-11-06T00:00:00.000Z'
                      index: '1.0801'
                      drawdown: '0.004'
                      stale: false
                    - at: '2026-11-07T00:00:00.000Z'
                      index: '1.0842'
                      drawdown: '0'
                      stale: false
