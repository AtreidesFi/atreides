        lot:
          $ref: '#/components/schemas/DecStr'
        minSize:
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        minNotional:
          oneOf:
            - $ref: '#/components/schemas/DecStr'
