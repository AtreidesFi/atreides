        - message
        - signature
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4096
        signature:
          $ref: '#/components/schemas/WalletSignature'
    LinkTelegramRequest:
      type: object
      additionalProperties: false
      required:
        - fields
      properties:
        fields:
          $ref: '#/components/schemas/TelegramFields'
    SecurityState:
      type: object
