        label:
          type: string
        orders:
          type: integer
          minimum: 0
        filledOrders:
          type: integer
          minimum: 0
        partialOrders:
          type: integer
          minimum: 0
        rejectedOrders:
          type: integer
          minimum: 0
        unknownOrders:
          type: integer
          minimum: 0
        postOnlyOrders:
          type: integer
          minimum: 0
        postOnlyFilled:
          type: integer
          minimum: 0
        ackLatencyMs:
          type: object
          additionalProperties: false
          required:
            - p50
            - p95
          properties:
            p50:
              oneOf:
