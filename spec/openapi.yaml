          not:
            required:
              - notional
        - required:
            - notional
          not:
            required:
              - size
      allOf:
        - not:
            properties:
              type:
                const: limit
            anyOf:
              - not:
                  required:
                    - price
                    - size
              - required:
                  - notional
              - required:
                  - maxSlippageBps
        - not:
            properties:
              type:
                const: market
            anyOf:
              - required:
                  - price
              - required:
                  - tif
                properties:
                  tif:
                    not:
                      const: ioc
    RouteRequestBody:
