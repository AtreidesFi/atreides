        - type: object
          additionalProperties: false
          required:
            - trigger
            - instrument
          properties:
            trigger:
              const: funding_threshold
            instrument:
              type: string
            aprAbove:
              $ref: '#/components/schemas/DecStr'
            aprBelow:
              $ref: '#/components/schemas/DecStr'
