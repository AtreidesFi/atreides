  /v1/strategy-specs/validate:
    post:
      operationId: validateStrategySpec
      summary: Check a spec without saving it.
      description: 'A validation answer, not a refusal: `data.ok` tells whether the spec is accepted. With a `window`, the answer adds the data coverage and a runtime estimate. Writes nothing.'
      tags:
        - Lab
      x-owner: '09'
      x-scope: read
      x-rate-class: read
      x-idempotency: none
      x-refusals:
