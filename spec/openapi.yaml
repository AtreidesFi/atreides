        - $ref: '#/components/schemas/VaultLogEvent'
        - $ref: '#/components/schemas/VaultLogBreach'
        - $ref: '#/components/schemas/VaultLogGuardian'
      discriminator:
        propertyName: kind
        mapping:
          event: '#/components/schemas/VaultLogEvent'
          breach: '#/components/schemas/VaultLogBreach'
          guardian: '#/components/schemas/VaultLogGuardian'
    VaultExposure:
      type: object
