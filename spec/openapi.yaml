                  minimum: 0
                - type: 'null'
            p95:
              oneOf:
                - type: number
                  minimum: 0
                - type: 'null'
        slippageBps:
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        ourFee:
          type: array
          items:
            $ref: '#/components/schemas/MoneyJson'
        report:
