                      ok:
                        const: true
                      data:
                        $ref: '#/components/schemas/SpecValidation'
                  - $ref: '#/components/schemas/Refusal'
              example:
                ok: true
                data:
                  ok: true
                  sha256: abababababababababababababababababababababababababababababababab
                  coverage: []
                  estimate:
                    variants: 1
                    bars: 0
                    estimateMs: 0
