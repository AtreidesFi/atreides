                      $ref: '#/components/schemas/DecStr'
                    ourFeeUsd:
                      $ref: '#/components/schemas/DecStr'
                    fundingUsd:
                      $ref: '#/components/schemas/DecStr'
                    fundingKnown:
                      type: boolean
                      description: Whether all selected legs could price the requested funding horizon. Returned for anonymous previews.
                    allInUsd:
                      $ref: '#/components/schemas/DecStr'
                    allInPrice:
                      $ref: '#/components/schemas/DecStr'
                planSha256:
                  type: string
            - type: 'null'
        bestFullSingle:
