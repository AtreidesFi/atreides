        accountIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        mode:
          type: string
          enum:
            - gateway
            - direct
      oneOf:
        - required:
            - size
          not:
            required:
              - notional
        - required:
            - notional
          not:
            required:
              - size
      allOf:
        - not:
            properties:
