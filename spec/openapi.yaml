      additionalProperties: false
      required:
        - venue
        - signed
      properties:
        venue:
          $ref: '#/components/schemas/VenueId'
        signed:
          type: object
          additionalProperties: {}
    RoutedOrder:
      type: object
      additionalProperties: false
      required:
        - group
        - side
        - type
        - route
        - clientRouteId
      properties:
        group:
          type: string
          minLength: 1
          maxLength: 128
        side:
          type: string
          enum:
            - buy
            - sell
        type:
          type: string
          enum:
            - limit
            - market
        tif:
          type: string
          enum:
            - ioc
            - gtc
            - post_only
        price:
          $ref: '#/components/schemas/DecStr'
        size:
          $ref: '#/components/schemas/DecStr'
        notional:
          $ref: '#/components/schemas/DecStr'
        reduceOnly:
          type: boolean
        maxSlippageBps:
          type: integer
          minimum: 1
          maximum: 2000
        tp:
          $ref: '#/components/schemas/TriggerJson'
        sl:
          $ref: '#/components/schemas/TriggerJson'
        fundingHorizonHours:
          type: integer
          minimum: 1
          maximum: 8760
        split:
