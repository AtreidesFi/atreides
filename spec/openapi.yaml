            - equity
            - etf
            - index
            - commodity
            - fx
            - bond
            - pre_ipo
            - unknown
        shareRate:
          description: Venue token units per share, set only on `stock_token` (token amount = shares x shareRate, token price = share price / shareRate); display and checks only, since orders use the venue's own exact rate (04 §6a).
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        base:
          type: string
        quote:
          type: string
        feeAsset:
          type: string
        chargedSide:
          type: string
          enum:
            - both
            - sell_only
            - none
        tick:
