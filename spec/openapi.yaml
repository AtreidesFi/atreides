        - nado
        - derive
        - dydx
        - sodex
        - txflow
        - arcus
        - polymarket-perps
        - risex
        - qfex
        - polymarket
        - kalshi
        - robinhood-chain
        - okx
        - bybit
        - bitget
        - gate
        - kraken
        - binance
        - lighter-rh
    VenueKind:
      type: string
      description: The kind of a venue.
      enum:
        - dex
        - cex
        - prediction
        - onchain_swap
    ChainFamily:
      type: string
      description: The family of the chain a venue's wallet lives on.
      enum:
        - evm
        - solana
        - starknet
        - cosmos
    Region:
      type: string
      description: A region the gateway runs in.
      enum:
        - tyo
        - sin
        - lon
        - ams
        - dub
    InstrumentClass:
      type: string
      description: The class of an instrument.
      enum:
        - perp
        - hip3_perp
        - rwa_perp
        - spot
        - outcome
        - option
        - prediction
        - stock_token
    Mode:
      type: string
      description: How an order reaches a venue, from the bot (direct), through the gateway, or from the terminal.
      enum:
        - direct
        - gateway
        - terminal
    KeyPlace:
      type: string
      description: Where the key that signs for the venue lives.
      enum:
        - bot
        - browser
        - wallet
        - signer
        - enclave
    VenueState:
      type: string
      description: The state of a gate unit. The values keep their decided spelling.
      enum:
        - closed
        - d-only
        - open
        - reduce-only
        - paused
    GateStage:
      type: string
      description: The stage a gate unit has passed.
      enum:
        - S
        - T
        - C
        - P
        - open
    CustodyClass:
      type: string
      description: What the key held for the venue can do.
      enum:
        - venue_trade_only
        - owner_withdraw
    CredentialHolder:
      type: string
      description: Where a stored credential lives.
      enum:
        - bot
        - browser
        - signer
        - enclave
    CredentialKind:
      type: string
      description: The kind of a stored credential.
      enum:
        - agent
        - api_key_trade
        - api_key_read
        - session_key
        - proxy_key
        - authenticator
        - linked_signer
        - stark_key
        - fast_api_key
        - oauth_token
    AccountKind:
      type: string
      description: The kind of a venue account.
      enum:
        - user
        - internal
        - test
        - fleet
    OrderState:
      type: string
      description: The state of an order.
      enum:
        - pending
        - accepted
        - resting
        - partially_filled
        - filled
        - cancelled
        - rejected
        - unknown
    ShareState:
      type: string
