      required:
        - asOf
        - byMarket
      properties:
        asOf:
          $ref: '#/components/schemas/Instant'
        byMarket:
          type: array
          items:
            $ref: '#/components/schemas/VaultExposureRow'
    MyVaultAccount:
      type: object
      description: One of the caller's seats in a vault, with its lots, open redemptions and statements.
      required:
        - vaultAccountId
        - vaultId
        - seatRole
        - status
        - nav
        - navAt
        - perfAccrued
        - lots
        - redemptionAddress
        - openRedemptions
        - statements
      properties:
        vaultAccountId:
