          $ref: '#/components/schemas/MatrixReadiness'
        offered:
          type: boolean
          description: True when every capability the kind's flows need is `yes`.
    VaultRecord:
      type: object
      description: The hash of one day's record of one vault account (NAV-03).
      required:
        - vaultAccountRef
        - day
        - sha256
      properties:
        vaultAccountRef:
          type: string
          description: An opaque per-vault ordinal, never an address (PSP-02).
