                    oneOf:
                      - $ref: '#/components/schemas/Instant'
                      - type: 'null'
        - type: object
          required:
            - type
            - id
            - serverTime
          properties:
            type:
              const: pong
            id:
              type: string
            serverTime:
              $ref: '#/components/schemas/Instant'
        - type: object
          required:
            - type
            - id
            - code
            - message
          properties:
            type:
              const: error
            id:
              type:
                - string
                - 'null'
            code:
              type: string
            message:
              type: string
        - type: object
          required:
