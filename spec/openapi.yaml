                  type: array
                  items:
                    $ref: '#/components/schemas/RoutePreviewLeg'
                coveredSize:
                  $ref: '#/components/schemas/DecStr'
                uncoveredSize:
                  $ref: '#/components/schemas/DecStr'
                arrivalPrice:
                  $ref: '#/components/schemas/DecStr'
                worstPrice:
