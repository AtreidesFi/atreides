            data:
              type: object
              additionalProperties: true
        - type: object
          required:
            - type
            - id
            - op
            - results
          properties:
            type:
              const: ack
            id:
              type: string
            op:
              const: heartbeat
            results:
              type: array
              items:
                type: object
                required:
                  - accountId
                  - ok
                  - code
                  - firesAt
                properties:
                  accountId:
                    $ref: '#/components/schemas/Uuid'
                  ok:
