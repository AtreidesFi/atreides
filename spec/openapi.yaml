          items:
            type: string
    KeyKind:
      type: string
      description: '`ed25519` is a bot''s key pair; `mcp_token` is a bearer token for the MCP endpoint.'
      enum:
        - ed25519
        - mcp_token
    ApiScope:
      type: string
      enum:
        - read
        - trade
    KeyScopes:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        $ref: '#/components/schemas/ApiScope'
    KeyAccounts:
      description: The venue accounts the key may act on, or `all` for a read-only key.
      oneOf:
        - type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        - const: all
    KeyState:
      type: string
      enum:
        - active
        - rotating
        - expired
        - revoked
    ApiKeyMode:
      type: string
      enum:
        - normal
        - reduce_only
    ApiKeyLimits:
      type: object
      additionalProperties: false
      required:
        - maxOrderNotional
        - dailyNotional
        - maxOpenNotional
        - maxDailyLoss
        - maxOpenOrders
        - maxOrdersPerMin
        - venues
        - classes
        - instruments
        - mode
      properties:
        maxOrderNotional:
          oneOf:
            - $ref: '#/components/schemas/MoneyJson'
            - type: 'null'
        dailyNotional:
          oneOf:
            - $ref: '#/components/schemas/MoneyJson'
            - type: 'null'
        maxOpenNotional:
          oneOf:
            - $ref: '#/components/schemas/MoneyJson'
            - type: 'null'
        maxDailyLoss:
          oneOf:
            - $ref: '#/components/schemas/MoneyJson'
            - type: 'null'
        maxOpenOrders:
          type:
            - integer
            - 'null'
        maxOrdersPerMin:
          type:
            - integer
            - 'null'
        venues:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/VenueId'
            - type: 'null'
        classes:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/InstrumentClass'
            - type: 'null'
        instruments:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/InstrumentId'
            - type: 'null'
        mode:
          description: '`reduce_only` while the key is frozen: it can close and cancel, not open. A user panic blocks the key too and is not shown here.'
          $ref: '#/components/schemas/ApiKeyMode'
    ApiKey:
      type: object
      additionalProperties: false
      required:
        - id
        - keyText
        - kind
        - name
        - scopes
        - accounts
        - ipAllowlist
        - state
        - expiresAt
        - rotatedTo
        - overlapUntil
        - createdAt
        - lastUsedAt
        - grantSigner
        - limits
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        keyText:
          type: string
          description: '`live_…` or `test_…`. For an MCP token, the part before the secret.'
        kind:
          $ref: '#/components/schemas/KeyKind'
        name:
          type: string
        scopes:
          $ref: '#/components/schemas/KeyScopes'
        accounts:
          $ref: '#/components/schemas/KeyAccounts'
        ipAllowlist:
          type: array
          items:
            type: string
        state:
          $ref: '#/components/schemas/KeyState'
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        rotatedTo:
          description: The key that replaced this one.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        overlapUntil:
          description: While `rotating`, when the key stops working.
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Instant'
        lastUsedAt:
          description: Written at most once a minute.
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        grantSigner:
          type:
            - string
            - 'null'
        limits:
          $ref: '#/components/schemas/ApiKeyLimits'
    KeyPublicKey:
      type: string
      description: An Ed25519 public key, base64url of 32 bytes.
      pattern: ^[A-Za-z0-9_-]{43}$
    KeyGrant:
      type: object
      description: The wallet signature a trade key needs (03 §5.5).
      additionalProperties: false
      required:
        - message
        - signature
        - signer
        - scheme
      properties:
        message:
          type: string
          description: The exact grant text that was signed.
          minLength: 1
          maxLength: 4096
        signature:
          type: string
          minLength: 1
          maxLength: 1024
        signer:
          type: string
          minLength: 1
          maxLength: 128
        scheme:
          $ref: '#/components/schemas/GrantScheme'
    ApiKeyLimitsInput:
      type: object
      additionalProperties: false
      description: 'A new version of the key''s limits (03 API-066, 05 §10b.7). A field left out is cleared; `mode` is never set here: `freeze` and `unfreeze` own it, and a version written here keeps the mode the key has.'
      properties:
        maxOrderNotional:
          $ref: '#/components/schemas/MoneyJson'
        dailyNotional:
          $ref: '#/components/schemas/MoneyJson'
        maxOpenNotional:
          $ref: '#/components/schemas/MoneyJson'
        maxDailyLoss:
          description: Refused `feature_unavailable` until the ledger can compute a day loss (07 LG-072); a key never carries a limit that would block every opening.
          $ref: '#/components/schemas/MoneyJson'
        maxOpenOrders:
          type: integer
          minimum: 1
          maximum: 10000
        maxOrdersPerMin:
          type: integer
          minimum: 1
          maximum: 100000
        venues:
          type: array
          maxItems: 24
          uniqueItems: true
          items:
            $ref: '#/components/schemas/VenueId'
        classes:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InstrumentClass'
        instruments:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InstrumentId'
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required:
        - kind
        - name
        - scopes
        - accounts
        - ipAllowlist
      properties:
        kind:
          $ref: '#/components/schemas/KeyKind'
        name:
          type: string
          pattern: ^[A-Za-z0-9 ._-]{1,40}$
        publicKey:
          description: '`ed25519` only, and required for it: the public key the client made.'
          $ref: '#/components/schemas/KeyPublicKey'
        scopes:
          description: '`[''read'']` or `[''read'', ''trade'']`. An `mcp_token` with `trade` is an agent token (API-073): bound accounts, `expiresAt` within 90 days, and `limits.maxOrderNotional` and `limits.dailyNotional`.'
          $ref: '#/components/schemas/KeyScopes'
        accounts:
          description: Venue account ids the key may act on. `all` only for a key whose scopes are `['read']`.
          $ref: '#/components/schemas/KeyAccounts'
        ipAllowlist:
          type: array
          description: IPv4 or IPv6 CIDRs, at most 16. Empty means any address.
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 49
        expiresAt:
          description: Required for a trade key (at most 365 days ahead; 365 days if left out) and for an agent token (at most 90 days ahead, no default). Optional for others (at most 2 years).
          $ref: '#/components/schemas/Instant'
        grant:
          description: Required when an `ed25519` key's `scopes` has `trade`; never on an `mcp_token`.
          $ref: '#/components/schemas/KeyGrant'
        limits:
          $ref: '#/components/schemas/ApiKeyLimitsInput'
    ApiKeyCreated:
      type: object
      additionalProperties: false
      required:
        - apiKey
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        token:
          type: string
          description: '`mcp_token` only. The token. Shown once and never again.'
    ApiKeyRotate:
      type: object
      additionalProperties: false
      required:
        - publicKey
      properties:
        publicKey:
          $ref: '#/components/schemas/KeyPublicKey'
        grant:
          description: Required when the key being replaced has `trade`.
          $ref: '#/components/schemas/KeyGrant'
        overlapHours:
          type: integer
          description: How long the old key keeps working.
          minimum: 1
          maximum: 168
          default: 24
    ApiKeyRotated:
      type: object
      additionalProperties: false
      required:
        - old
        - new
      properties:
        old:
          $ref: '#/components/schemas/ApiKey'
        new:
          $ref: '#/components/schemas/ApiKey'
    KeyEnv:
