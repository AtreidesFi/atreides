  /v1/panic:
    post:
      operationId: panic
      summary: Stop everything the user has opening.
      description: 'Trade scope or session. Blocks every opening order of the user, whatever the key, the session or the ticket (`key_frozen`), then cancels the resting opening orders on every account of the user. With `cancelProtective` the reduce-only orders go too. It never closes a position and never touches the dead-man. Closes stay possible. Repeating it is harmless: it blocks again and cancels what rests.'
      tags:
        - Orders
      x-owner: '03'
      x-scope: trade
      x-rate-class: protect
      x-idempotency: target
      x-refusals:
        - unavailable
      security:
        - session: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanicRequest'
            example:
              cancelProtective: false
      responses:
        '200':
          description: What was cancelled, or a refusal.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - ok
                      - data
                    properties:
                      ok:
                        const: true
                      data:
                        $ref: '#/components/schemas/PanicResult'
                  - $ref: '#/components/schemas/Refusal'
              example:
                ok: true
                data:
                  cancelledOrders: 3
                  cancelledParents: 0
                  blockedUntilClear: true
                  notCancelled: 0
