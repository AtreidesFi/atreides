            - terminal
            - mcp
            - ticket
            - route
            - guardian
        side:
          type: string
          enum:
            - buy
            - sell
        type:
          description: The order as placed. A trigger type (`stop_market`, `stop_limit`, `take_market`, `take_limit`) rests at a venue that holds it.
          type: string
