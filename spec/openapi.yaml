    RoutePreviewRequest:
      type: object
      description: An indicative route quote needs no account. Exactly one of size (base units) and notional (USD).
      additionalProperties: false
      required:
        - group
        - side
      properties:
        group:
          type: string
          minLength: 1
          maxLength: 128
          description: The instrument group, for example perp:BTC, spot:ETH/USDC, stock:NVDA or single:<instrumentId>.
        side:
          type: string
          enum:
            - buy
            - sell
        size:
          $ref: '#/components/schemas/DecStr'
        notional:
          $ref: '#/components/schemas/DecStr'
        price:
          $ref: '#/components/schemas/DecStr'
        maxSlippageBps:
          type: integer
          minimum: 1
          maximum: 2000
        includeVenues:
          type: array
          items:
            $ref: '#/components/schemas/RoutePreviewVenueId'
          minItems: 1
          maxItems: 15
          uniqueItems: true
        excludeVenues:
          type: array
          items:
            $ref: '#/components/schemas/RoutePreviewVenueId'
          minItems: 1
          maxItems: 15
          uniqueItems: true
        fundingHorizonHours:
          type: integer
          minimum: 1
          maximum: 8760
        split:
          type: boolean
        maxLegs:
          type: integer
          minimum: 1
          maximum: 8
      oneOf:
