              properties:
                p50Ms:
                  type: integer
                p99Ms:
                  type: integer
                from:
                  type: string
                measuredAt:
                  $ref: '#/components/schemas/Instant'
            - type: 'null'
        status:
          type: object
          required:
            - reachable
            - lastFrameAgeMs
            - checkedAt
          properties:
            reachable:
              type: boolean
            lastFrameAgeMs:
              type:
                - integer
                - 'null'
            checkedAt:
              $ref: '#/components/schemas/Instant'
    InstrumentInfo:
      type: object
      description: A tradable market of a venue.
      required:
        - instrumentId
        - venue
        - venueSymbol
        - cls
        - underlying
        - shareRate
        - base
        - quote
        - feeAsset
        - chargedSide
        - tick
        - lot
        - minSize
        - minNotional
        - maxLeverage
        - status
        - venueExtra
