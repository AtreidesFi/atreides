        cls:
          $ref: '#/components/schemas/InstrumentClass'
        state:
          $ref: '#/components/schemas/VenueState'
        stage:
          $ref: '#/components/schemas/GateStage'
    VenueInfo:
      type: object
      description: A venue, its gate units, fee model, measured latency and reachability.
      required:
