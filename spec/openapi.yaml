            - type: 'null'
        count:
          type: integer
          minimum: 0
    ExecutionAggregate:
      type: object
      description: Notional-weighted figures use USD notional; an order without a figure is left out of that figure and a figure no order can give is null, never zero.
      additionalProperties: false
      required:
        - orders
        - filledNotionalUsd
        - slippageVsArrivalBps
        - slippageVsMidBps
        - venueFeesUsd
        - ourFeesUsd
        - decisionMs
        - msToAck
        - msToFirstFill
        - fillRate
        - rejectRate
      properties:
        orders:
          type: integer
          minimum: 0
        filledNotionalUsd:
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        slippageVsArrivalBps:
          description: Confirmed taker slippage against the arrival book mid, weighted by taker USD notional.
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        slippageVsMidBps:
          description: The same confirmed taker book-mid measure as slippageVsArrivalBps.
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        venueFeesUsd:
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        ourFeesUsd:
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        decisionMs:
          $ref: '#/components/schemas/ExecutionLatency'
        msToAck:
          $ref: '#/components/schemas/ExecutionLatency'
        msToFirstFill:
          $ref: '#/components/schemas/ExecutionLatency'
        fillRate:
          description: Filled size divided by ordered size across final orders.
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
        rejectRate:
          oneOf:
            - $ref: '#/components/schemas/DecStr'
            - type: 'null'
    ExecutionRow:
