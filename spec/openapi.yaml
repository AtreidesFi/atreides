          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        mode:
          type: string
          enum:
            - gateway
            - direct
        route:
          const: best
        clientRouteId:
          $ref: '#/components/schemas/ClientOrderId'
        quoteId:
          type: string
          minLength: 1
          maxLength: 16384
        replan:
          type: integer
          minimum: 1
          maximum: 2
