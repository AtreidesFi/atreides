        quietFrom:
          oneOf:
            - type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
        quietTo:
          oneOf:
            - type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        hourlyCap:
