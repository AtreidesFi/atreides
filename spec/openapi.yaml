      allOf:
        - $ref: '#/components/schemas/VaultSummary'
        - type: object
          required:
            - terms
            - matrixRow
            - whoCanDoWhat
            - ruleSeat
            - drawdownNow
            - breachCount
            - guardianActionCount
            - noticeEndsAt
            - closeReason
            - passportMark
          properties:
            terms:
              $ref: '#/components/schemas/VaultTerms'
            matrixRow:
              $ref: '#/components/schemas/VaultMatrixRow'
            whoCanDoWhat:
              type: array
              items:
                $ref: '#/components/schemas/VaultWhoCanDoWhat'
            ruleSeat:
              description: Null where the venue has no rule seat (a record vault).
              oneOf:
                - $ref: '#/components/schemas/VaultRuleSeat'
                - type: 'null'
            drawdownNow:
              $ref: '#/components/schemas/VaultDecOrNull'
            breachCount:
              type: integer
              minimum: 0
            guardianActionCount:
              type: integer
              minimum: 0
            noticeEndsAt:
              $ref: '#/components/schemas/VaultInstantOrNull'
            closeReason:
              oneOf:
                - $ref: '#/components/schemas/VaultCloseReason'
                - type: 'null'
            passportMark:
              oneOf:
                - $ref: '#/components/schemas/PassportMark'
                - type: 'null'
    IndexPoint:
      type: object
      required:
        - at
        - index
        - drawdown
        - stale
      properties:
        at:
          $ref: '#/components/schemas/Instant'
        index:
          $ref: '#/components/schemas/DecStr'
        drawdown:
          $ref: '#/components/schemas/DecStr'
        stale:
          type: boolean
          description: True when a venue read behind this point was stale; the chart shows a gap.
    VaultLogEntry:
      description: A public event, a breach or a guardian action, told by `kind`.
