        - sent
        - confirmed
        - reconciled
        - halted
    InstrumentId:
      type: string
      description: An instrument id, `<venue>:<venueSymbol>` (01 §5.9).
      minLength: 3
      maxLength: 160
      pattern: ^[a-z0-9-]+:.+$
      examples:
        - hyperliquid:BTC
    VenueUnit:
      type: object
      description: One gate unit of a venue. A unit that is not open for this caller shows its state; it is never hidden.
      required:
        - mode
        - keyPlace
        - cls
        - state
        - stage
      properties:
