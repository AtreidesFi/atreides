  /v1/auth/discord/start:
    get:
      operationId: startDiscordSignIn
      summary: 'Start the Discord sign-in or link: redirect to Discord.'
      description: Answers 302 to Discord and sets the `__Host-oauth` cookie that binds the flow to this browser. Open it as a top-level navigation. `purpose=link` needs a session.
      tags:
        - Auth
      x-owner: '03'
      x-scope: public
      x-rate-class: auth
      x-idempotency: none
      x-refusals:
        - invalid_request
        - feature_unavailable
      security:
        - {}
        - session: []
        - apiKey: []
      parameters:
        - name: purpose
          in: query
          required: true
          description: Sign in, or link Discord to the signed-in user.
          schema:
            type: string
            enum:
              - sign_in
              - link
        - name: invite
          in: query
          required: false
          description: An invite code or a pasted invite link.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: ref
          in: query
          required: false
          description: A referral code.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: returnTo
          in: query
          required: true
          description: The path of the app to return to. Only a path is accepted.
          schema:
            type: string
            pattern: ^/[A-Za-z0-9/_?=&.-]{0,200}$
          example: /settings
      responses:
        '200':
          description: A refusal.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
              example:
                ok: false
                code: feature_unavailable
                message: Discord sign-in is not available yet.
                retryable: false
                requestId: 01936f2e-7c43-74aa-8719-cdbcab9a8f7e
        '302':
          description: Redirect to Discord.
          headers:
            Location:
              description: The Discord authorize URL.
              schema:
                type: string
            Set-Cookie:
              description: 'The cookie `__Host-oauth`: HttpOnly, Secure, SameSite=Lax, Path=/, Max-Age=600.'
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
  /v1/auth/discord/callback:
    get:
      operationId: finishDiscordSignIn
      summary: 'Finish the Discord sign-in or link: Discord returns here.'
      description: Answers 302 to the `returnTo` of the start, with `?signin=ok` or `?signin=<code>` where the code is `discord_auth_failed`, `invite_required`, `invite_invalid` or `identity_linked_elsewhere`. A redirect cannot carry a 503, so an unreachable Discord is `discord_auth_failed` too. When the state is unknown there is no return path, and the answer is the 200 refusal. Sets the session cookie on success and clears `__Host-oauth`. When the user declined, Discord sends `error` and no `code`.
      tags:
        - Auth
      x-owner: '03'
      x-scope: public
      x-rate-class: auth
      x-idempotency: none
      x-refusals:
        - discord_auth_failed
        - invite_required
        - invite_invalid
        - identity_linked_elsewhere
      security:
        - {}
        - session: []
        - apiKey: []
      parameters:
        - name: code
          in: query
          required: false
          description: The authorization code. Absent when the user declined.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: state
          in: query
          required: true
          description: The state value the start sent to Discord.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: error
          in: query
          required: false
          description: Discord's error code, for example `access_denied`.
          schema:
            type: string
            maxLength: 128
        - name: error_description
          in: query
          required: false
          description: Discord's error text.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: 'A refusal, only when the state is unknown, expired or not bound to this browser: there is then no return path to redirect to.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
              example:
                ok: false
                code: discord_auth_failed
                message: 'The Discord login could not be completed: state_unknown. Start again.'
                retryable: false
                requestId: 01936f2e-7c43-74aa-8719-cdbcab9a8f7e
        '302':
          description: Redirect to the return path with `?signin=ok` or `?signin=<code>`.
          headers:
            Location:
              description: The return path with the sign-in result.
              schema:
                type: string
            Set-Cookie:
              description: The session cookie `__Host-sid` on success, and an expired `__Host-oauth`.
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
