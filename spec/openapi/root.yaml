# OpenAPI source. This file references the operation and schema files below.
openapi: 3.1.0
info:
  title: Atreides API
  version: 1.0.0
  description: >-
    The REST API under /v1. Every answer is an envelope: `{ ok: true, data }` or, for a decided refusal, HTTP 200 with
    `{ ok: false, code, message, retryable, requestId }`; transport errors carry the same body with their HTTP status.
    Inside v1 changes are additive only: ignore fields you do not know and map codes and enum values you do not know
    to a generic case.
servers:
  - url: https://api.atreides.finance
    description: The Atreides public API.
tags:
  - name: Auth
    description: Sign-in, sessions, wallets, identities and the second factor.
  - name: Keys
    description: API keys.
  - name: Venues
    description: Venues, instruments and attestation.
  - name: Markets
    description: Public market data and comparisons.
  - name: Fees
    description: The fee schedule and quotes.
  - name: Accounts
    description: Venue accounts, connections and limits.
  - name: Orders
    description: Placing, changing and cancelling orders.
  - name: Reads
    description: Positions, balances, fills, equity and monitor.
  - name: Rewards
    description: Rewards, claims and tier.
  - name: Assistant
    description: The assistant, tickets, notes, notices, alerts and chat links.
  - name: Community
    description: Competitions, passport, referrals and invites.
  - name: Lab
    description: Strategies, runs, exports and the library.
  - name: Vaults
    description: Vaults.
  - name: Web
    description: Pages of the web app that have their own data.
  - name: Security
    description: Incident reports and security status.
  - name: Stream
    description: The WebSocket stream.
x-tagGroups:
  - name: Account
    tags: [Auth, Keys, Accounts, Security]
  - name: Markets and trading
    tags: [Venues, Markets, Fees, Orders, Reads, Stream]
  - name: Products
    tags: [Rewards, Assistant, Community, Lab, Vaults, Web]
