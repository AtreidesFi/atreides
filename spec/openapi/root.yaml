components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: >-
        The session cookie of the web app, scoped to its issuing origin. Requests that change data from a browser
        also need an allowed Origin.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >-
        A signed request. Send X-Api-Key with the key text, X-Api-Timestamp, X-Api-Nonce and X-Api-Signature, the
        Ed25519 signature of the seven-line string of the signing rules. A `read` key reaches read operations; a `trade`
        key reaches both.
    service:
      type: http
      scheme: Service
      description: >-
        The chat service credential, `Authorization: Service <token>`, with X-Acting-For and X-Atr-Chat-Link. It
        reaches only the operations marked `x-service`. Not for integrations.
