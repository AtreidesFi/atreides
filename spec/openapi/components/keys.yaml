# API keys (03 §5.4, §7.2, §8). Every request object is closed.
ApiScope:
  type: string
  enum: [read, trade]
KeyKind:
  type: string
  description: "`ed25519` is a bot's key pair; `mcp_token` is a bearer token for the MCP endpoint."
  enum: [ed25519, mcp_token]
KeyState:
  type: string
  enum: [active, rotating, expired, revoked]
GrantScheme:
  type: string
  description: How the wallet signed the grant text.
  enum: [eip191, solana, adr36]
KeyEnv:
  type: string
  enum: [live, test]
KeyAccounts:
  description: The venue accounts the key may act on, or `all` for a read-only key.
  oneOf:
    - type: array
      maxItems: 200
      uniqueItems: true
      items:
        $ref: ./primitives.yaml#/Uuid
    - const: all
KeyScopes:
  type: array
  minItems: 1
  maxItems: 2
  uniqueItems: true
  items:
    $ref: "#/ApiScope"
KeyGrant:
  type: object
  description: The wallet signature a trade key needs (03 §5.5).
  additionalProperties: false
  required: [message, signature, signer, scheme]
  properties:
    message:
      type: string
      description: The exact grant text that was signed.
      minLength: 1
      maxLength: 4096
    signature:
      type: string
      minLength: 1
      maxLength: 1024
    signer:
      type: string
      minLength: 1
      maxLength: 128
    scheme:
      $ref: "#/GrantScheme"
KeyPublicKey:
  type: string
  description: An Ed25519 public key, base64url of 32 bytes.
  pattern: "^[A-Za-z0-9_-]{43}$"
ApiKeyLimitsInput:
  type: object
  additionalProperties: false
  description: >-
    A new version of the key's limits (03 API-066, 05 §10b.7). A field left out is cleared; `mode` is never set here:
    `freeze` and `unfreeze` own it, and a version written here keeps the mode the key has.
  properties:
    maxOrderNotional:
      $ref: ./primitives.yaml#/MoneyJson
    dailyNotional:
      $ref: ./primitives.yaml#/MoneyJson
    maxOpenNotional:
      $ref: ./primitives.yaml#/MoneyJson
    maxDailyLoss:
      description: "Refused `feature_unavailable` until the ledger can compute a day loss (07 LG-072); a key never carries a limit that would block every opening."
      $ref: ./primitives.yaml#/MoneyJson
    maxOpenOrders:
      type: integer
      minimum: 1
      maximum: 10000
    maxOrdersPerMin:
      type: integer
      minimum: 1
      maximum: 100000
    venues:
      type: array
      maxItems: 24
      uniqueItems: true
      items:
        $ref: ./primitives.yaml#/VenueId
    classes:
      type: array
      maxItems: 8
      uniqueItems: true
      items:
        $ref: ./primitives.yaml#/InstrumentClass
    instruments:
      type: array
      maxItems: 200
      uniqueItems: true
      items:
        $ref: ./venues.yaml#/InstrumentId
ApiKeyMode:
  type: string
  enum: [normal, reduce_only]
ApiKeyLimits:
  type: object
  additionalProperties: false
  required:
    - maxOrderNotional
    - dailyNotional
    - maxOpenNotional
    - maxDailyLoss
    - maxOpenOrders
    - maxOrdersPerMin
    - venues
    - classes
    - instruments
    - mode
  properties:
    maxOrderNotional:
      oneOf:
        - $ref: ./primitives.yaml#/MoneyJson
        - type: "null"
    dailyNotional:
      oneOf:
        - $ref: ./primitives.yaml#/MoneyJson
        - type: "null"
    maxOpenNotional:
      oneOf:
        - $ref: ./primitives.yaml#/MoneyJson
        - type: "null"
    maxDailyLoss:
      oneOf:
        - $ref: ./primitives.yaml#/MoneyJson
        - type: "null"
    maxOpenOrders:
      type: [integer, "null"]
    maxOrdersPerMin:
      type: [integer, "null"]
    venues:
      oneOf:
        - type: array
          items:
            $ref: ./primitives.yaml#/VenueId
        - type: "null"
    classes:
      oneOf:
        - type: array
          items:
            $ref: ./primitives.yaml#/InstrumentClass
        - type: "null"
    instruments:
      oneOf:
        - type: array
          items:
            $ref: ./venues.yaml#/InstrumentId
        - type: "null"
    mode:
      description: "`reduce_only` while the key is frozen: it can close and cancel, not open. A user panic blocks the key too and is not shown here."
      $ref: "#/ApiKeyMode"
ApiKeyCreate:
  type: object
  additionalProperties: false
  required: [kind, name, scopes, accounts, ipAllowlist]
  properties:
    kind:
      $ref: "#/KeyKind"
    name:
      type: string
      pattern: "^[A-Za-z0-9 ._-]{1,40}$"
    publicKey:
      description: "`ed25519` only, and required for it: the public key the client made."
      $ref: "#/KeyPublicKey"
    scopes:
      description: "`['read']` or `['read', 'trade']`. An `mcp_token` with `trade` is an agent token (API-073): bound accounts, `expiresAt` within 90 days, and `limits.maxOrderNotional` and `limits.dailyNotional`."
      $ref: "#/KeyScopes"
    accounts:
      description: Venue account ids the key may act on. `all` only for a key whose scopes are `['read']`.
      $ref: "#/KeyAccounts"
    ipAllowlist:
      type: array
      description: IPv4 or IPv6 CIDRs, at most 16. Empty means any address.
      maxItems: 16
      items:
        type: string
        minLength: 1
        maxLength: 49
    expiresAt:
      description: >-
        Required for a trade key (at most 365 days ahead; 365 days if left out) and for an agent token (at most 90
        days ahead, no default). Optional for others (at most 2 years).
      $ref: ./primitives.yaml#/Instant
    grant:
      description: Required when an `ed25519` key's `scopes` has `trade`; never on an `mcp_token`.
      $ref: "#/KeyGrant"
    limits:
      $ref: "#/ApiKeyLimitsInput"
ApiKey:
  type: object
  additionalProperties: false
  required:
    - id
    - keyText
    - kind
    - name
    - scopes
    - accounts
    - ipAllowlist
    - state
    - expiresAt
    - rotatedTo
    - overlapUntil
    - createdAt
    - lastUsedAt
    - grantSigner
    - limits
  properties:
    id:
      $ref: ./primitives.yaml#/Uuid
    keyText:
      type: string
      description: "`live_…` or `test_…`. For an MCP token, the part before the secret."
    kind:
      $ref: "#/KeyKind"
    name:
      type: string
    scopes:
      $ref: "#/KeyScopes"
    accounts:
      $ref: "#/KeyAccounts"
    ipAllowlist:
      type: array
      items:
        type: string
    state:
      $ref: "#/KeyState"
    expiresAt:
      oneOf:
        - $ref: ./primitives.yaml#/Instant
        - type: "null"
    rotatedTo:
      description: The key that replaced this one.
      oneOf:
        - $ref: ./primitives.yaml#/Uuid
        - type: "null"
    overlapUntil:
      description: While `rotating`, when the key stops working.
      oneOf:
        - $ref: ./primitives.yaml#/Instant
        - type: "null"
    createdAt:
      $ref: ./primitives.yaml#/Instant
    lastUsedAt:
      description: Written at most once a minute.
      oneOf:
        - $ref: ./primitives.yaml#/Instant
        - type: "null"
    grantSigner:
      type: [string, "null"]
    limits:
      $ref: "#/ApiKeyLimits"
ApiKeyCreated:
  type: object
  additionalProperties: false
  required: [apiKey]
  properties:
    apiKey:
      $ref: "#/ApiKey"
    token:
      type: string
      description: "`mcp_token` only. The token. Shown once and never again."
ApiKeyRotate:
  type: object
  additionalProperties: false
  required: [publicKey]
  properties:
    publicKey:
      $ref: "#/KeyPublicKey"
    grant:
      description: Required when the key being replaced has `trade`.
      $ref: "#/KeyGrant"
    overlapHours:
      type: integer
      description: How long the old key keeps working.
      minimum: 1
      maximum: 168
      default: 24
ApiKeyRotated:
  type: object
  additionalProperties: false
  required: [old, new]
  properties:
    old:
      $ref: "#/ApiKey"
    new:
      $ref: "#/ApiKey"
Whoami:
  type: object
  additionalProperties: false
  required: [userId, principal, scopes, accounts, env, serverTime]
  properties:
    userId:
      $ref: ./primitives.yaml#/Uuid
    principal:
      type: string
      enum: [session, api_key]
    keyText:
      type: string
      description: For an API key only.
    scopes:
      type: array
      items:
        $ref: "#/ApiScope"
    accounts:
      $ref: "#/KeyAccounts"
    env:
      $ref: "#/KeyEnv"
    serverTime:
      $ref: ./primitives.yaml#/Instant
