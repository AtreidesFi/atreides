RouteBenchmark:
  type: object
  required: [from, to, rows, method, asOf]
  properties:
    from: { type: string, format: date }
    to: { type: string, format: date }
    rows:
      type: array
      items:
        type: object
        required: [group, side, notionalUsd, days, samples, splitShare, uncoveredShare, savingBps, venues]
        properties:
          group: { type: string }
          side: { type: string, enum: [buy, sell] }
          notionalUsd: { $ref: ./primitives.yaml#/DecStr }
          days: { type: integer, minimum: 1, maximum: 90 }
          samples: { type: integer, minimum: 0 }
          splitShare: { $ref: ./primitives.yaml#/DecStr }
          uncoveredShare: { $ref: ./primitives.yaml#/DecStr }
          savingBps:
            type: object
            required: [p10, p50, p90, mean]
            properties:
              p10: { $ref: ./primitives.yaml#/DecStr }
              p50: { $ref: ./primitives.yaml#/DecStr }
              p90: { $ref: ./primitives.yaml#/DecStr }
              mean: { $ref: ./primitives.yaml#/DecStr }
          venues: { type: array, items: { type: string } }
    method: { type: string }
    asOf: { $ref: ./primitives.yaml#/Instant }
