# The wire types every operation shares (01 §5.12 rule 4, §5.8; 03 §13.1). Decimals are strings, ids are UUIDv7, instants
# are millisecond RFC 3339 with Z. The patterns repeat DEC_PATTERN, the id pattern and CLIENT_ORDER_ID_PATTERN of
# @atr/core, and the enums repeat its registries; test/primitives.test.ts fails when either side moves alone.
DecStr:
  type: string
  description: A canonical decimal, at most 20 integer and 18 fraction digits. Money and sizes are never JSON numbers.
  pattern: "^-?(0|[1-9][0-9]{0,19})(\\.[0-9]{1,18})?$"
  examples: ["0", "-12.5", "0.000000000000000001"]
Instant:
  type: string
  format: date-time
  description: A moment in UTC, always with three fraction digits and a Z.
  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
  examples: ["2026-11-07T09:30:00.000Z"]
Uuid:
  type: string
  format: uuid
  description: An id, a lowercase UUIDv7.
  pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  examples: ["01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80"]
Hex:
  type: string
  description: Bytes as 0x and an even number of hex digits.
  pattern: "^0x([0-9a-fA-F]{2})*$"
  examples: ["0x", "0xdeadbeef"]
ClientOrderId:
  type: string
  description: The caller's id for an order. Sending the same id with the same body again returns the stored order.
  pattern: "^[A-Za-z0-9._:-]{1,64}$"
  examples: ["bot-7-000123"]
AssetId:
  type: string
  description: An asset id, lowercase.
  pattern: "^[a-z0-9][a-z0-9._-]{0,31}$"
  examples: ["usdc"]
MoneyJson:
  type: object
  description: An amount of one asset.
  additionalProperties: false
  required: [amount, asset]
  properties:
    amount:
      $ref: "#/DecStr"
    asset:
      $ref: "#/AssetId"
  examples:
    - { amount: "25.5", asset: usdc }
