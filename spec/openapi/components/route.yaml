Route:
  type: "object"
  additionalProperties: false
  required:
    [
      "routeId",
      "clientRouteId",
      "group",
      "side",
      "type",
      "tif",
      "mode",
      "origin",
      "execution",
      "reduceOnly",
      "requestedSize",
      "requestedNotional",
      "limitPrice",
      "worstPrice",
      "filledSize",
      "filledNotionalUsd",
      "avgPrice",
      "state",
      "endReason",
      "replans",
      "legs",
      "report",
      "createdAt",
      "updatedAt",
      "endedAt",
    ]
  properties:
    shortfall:
      type: "object"
      additionalProperties: false
      required: ["policy", "action", "filledSize", "remainingSize"]
      properties:
        policy:
          type: "string"
          enum: ["keep", "unwind"]
        action:
          type: "string"
          enum: ["kept", "unwind_requested", "nothing_filled"]
        filledSize:
          $ref: "./primitives.yaml#/DecStr"
        remainingSize:
          $ref: "./primitives.yaml#/DecStr"
    routeId:
      $ref: "./primitives.yaml#/Uuid"
    clientRouteId:
      $ref: "./primitives.yaml#/ClientOrderId"
    group:
      type: "string"
    side:
      type: "string"
      enum: ["buy", "sell"]
    type:
      type: "string"
      enum: ["limit", "market"]
    tif:
      type: "string"
      enum: ["ioc", "gtc", "post_only"]
    mode:
      $ref: "./primitives.yaml#/Mode"
    origin:
      type: "string"
      enum: ["api", "sdk", "terminal", "mcp", "ticket", "guardian"]
    execution:
      type: "string"
      enum: ["server", "client"]
    reduceOnly:
      type: "boolean"
    requestedSize:
      $ref: "./primitives.yaml#/DecStr"
    requestedNotional:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    limitPrice:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    worstPrice:
      $ref: "./primitives.yaml#/DecStr"
    filledSize:
      $ref: "./primitives.yaml#/DecStr"
    filledNotionalUsd:
      $ref: "./primitives.yaml#/DecStr"
    avgPrice:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    state:
      $ref: "#/RouteState"
    endReason:
      oneOf:
        [
          {
            "type": "string",
            "enum":
              [
                "filled",
                "depth",
                "replans_used",
                "refused",
                "cancelled_by_user",
                "kill_switch",
                "routing_off",
                "not_signed",
                "not_replanned",
                "recovered",
              ],
          },
          { "type": "null" },
        ]
    replans:
      type: "integer"
      minimum: 0
    lastRefusal:
      description: The last leg that ended without a fill when the route ended failed; absent otherwise. `code` is the order's reject code, else the leg's result code.
      type: "object"
      additionalProperties: false
      required: ["code", "leg", "replan"]
      properties:
        code:
          type: "string"
        leg:
          type: "integer"
          minimum: 0
        replan:
          type: "integer"
          minimum: 0
    legs:
      type: "array"
      items:
        $ref: "#/RouteLeg"
    plans:
      type: "array"
      items:
        $ref: "#/RoutePlan"
    report:
      oneOf: [{ "$ref": "#/RouteReport" }, { "type": "null" }]
    createdAt:
      $ref: "./primitives.yaml#/Instant"
    updatedAt:
      $ref: "./primitives.yaml#/Instant"
    endedAt:
      oneOf: [{ "$ref": "./primitives.yaml#/Instant" }, { "type": "null" }]
RoutePreviewVenueId:
  type: "string"
  description: The venues a preview may quote. Nothing else is in the product.
  enum:
    [
      "hyperliquid",
      "lighter",
      "lighter-rh",
      "aster",
      "grvt",
      "pacifica",
      "nado",
      "polymarket",
      "robinhood-chain",
      "binance",
      "okx",
      "bybit",
      "bitget",
      "gate",
      "kraken",
    ]
RoutePreviewRequest:
  type: "object"
  description: An indicative route quote needs no account. Exactly one of size (base units) and notional (USD).
  additionalProperties: false
  required: ["group", "side"]
  properties:
    group:
      type: "string"
      minLength: 1
      maxLength: 128
      description: The instrument group, for example perp:BTC, spot:ETH/USDC, stock:NVDA or single:<instrumentId>.
    side:
      type: "string"
      enum: ["buy", "sell"]
    size:
      $ref: "./primitives.yaml#/DecStr"
    notional:
      $ref: "./primitives.yaml#/DecStr"
    price:
      $ref: "./primitives.yaml#/DecStr"
    maxSlippageBps:
      type: "integer"
      minimum: 1
      maximum: 2000
    includeVenues:
      type: "array"
      items:
        $ref: "#/RoutePreviewVenueId"
      minItems: 1
      maxItems: 15
      uniqueItems: true
    excludeVenues:
      type: "array"
      items:
        $ref: "#/RoutePreviewVenueId"
      minItems: 1
      maxItems: 15
      uniqueItems: true
    fundingHorizonHours:
      type: "integer"
      minimum: 1
      maximum: 8760
    split:
      type: "boolean"
    maxLegs:
      type: "integer"
      minimum: 1
      maximum: 8
  oneOf:
    [
      { "required": ["size"], "not": { "required": ["notional"] } },
      { "required": ["notional"], "not": { "required": ["size"] } },
    ]
  allOf:
    # A price makes a limit (immediate-or-cancel) quote; a limit has no slippage bound and no notional.
    - not:
        required: ["price"]
        anyOf:
          - required: ["maxSlippageBps"]
          - required: ["notional"]
RoutePreviewSkipReason:
  type: "string"
  enum:
    [
      "no_market",
      "no_live_book",
      "no_book_source",
      "not_shareable",
      "stale_book",
      "market_closed",
      "insufficient_depth",
      "fee_schedule_unknown",
      "fee_rule_missing",
      "unit_unknown",
      "depeg",
      "below_minimum",
      "no_ioc",
    ]
RoutePreviewLevel:
  type: "object"
  additionalProperties: false
  required: ["px", "sz"]
  properties:
    px:
      $ref: "./primitives.yaml#/DecStr"
    sz:
      $ref: "./primitives.yaml#/DecStr"
RoutePreviewBook:
  type: "object"
  description: The live book a figure was walked on. ageMs is the answer's asOf less observedAt.
  additionalProperties: false
  required: ["snapshotId", "observedAt", "ageMs", "timestampSource", "levelsRead", "levelsSha256", "bandBasis"]
  properties:
    snapshotId:
      type: "string"
      description: The capture's epoch and sequence number of the image, venue:epoch:seq.
    observedAt:
      $ref: "./primitives.yaml#/Instant"
    ageMs:
      type: "integer"
      minimum: 0
    timestampSource:
      type: "string"
      enum: ["api_receive"]
      description: The live feed carries no venue time; observedAt is the API clock when the last frame was applied.
    levelsRead:
      type: "integer"
      minimum: 0
    levelsSha256:
      type: "string"
      description: sha256 of the canonical JSON of the bids and asks read, so a reproduction can check its book.
    bandBasis:
      type: "string"
      enum: ["mark", "book_mid"]
RoutePreviewVenueFee:
  type: "object"
  description: The venue's own public fee at the tier assumed, in basis points of notional. A negative maker rate is a rebate.
  additionalProperties: false
  required: ["tier", "takerBps", "makerBps", "source", "readAt", "assumed"]
  properties:
    tier:
      type: "string"
    takerBps:
      $ref: "./primitives.yaml#/DecStr"
    makerBps:
      $ref: "./primitives.yaml#/DecStr"
    source:
      type: "string"
    readAt:
      type: "string"
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    assumed:
      type: "boolean"
      const: true
RoutePreviewSingle:
  type: "object"
  description: "One venue alone for the quoted size, walked on its live book. Prices are USD per base unit; levels are in the venue's own price and size units."
  additionalProperties: false
  required:
    - "size"
    - "baseSize"
    - "limitPrice"
    - "touchPrice"
    - "avgPrice"
    - "slippageBps"
    - "notionalUsd"
    - "venueFeeRate"
    - "venueFeeUsd"
    - "ourFeeRate"
    - "ourFeeUsd"
    - "fundingUsd"
    - "allInUsd"
    - "allInPrice"
    - "levelsConsumed"
    - "levels"
    - "covers"
    - "coveredSize"
  properties:
    size:
      $ref: "./primitives.yaml#/DecStr"
    baseSize:
      $ref: "./primitives.yaml#/DecStr"
    limitPrice:
      $ref: "./primitives.yaml#/DecStr"
    touchPrice:
      $ref: "./primitives.yaml#/DecStr"
    avgPrice:
      $ref: "./primitives.yaml#/DecStr"
    slippageBps:
      $ref: "./primitives.yaml#/DecStr"
    notionalUsd:
      $ref: "./primitives.yaml#/DecStr"
    venueFeeRate:
      $ref: "./primitives.yaml#/DecStr"
    venueFeeUsd:
      $ref: "./primitives.yaml#/DecStr"
    ourFeeRate:
      $ref: "./primitives.yaml#/DecStr"
    ourFeeUsd:
      $ref: "./primitives.yaml#/DecStr"
    fundingUsd:
      $ref: "./primitives.yaml#/DecStr"
    allInUsd:
      $ref: "./primitives.yaml#/DecStr"
    allInPrice:
      $ref: "./primitives.yaml#/DecStr"
    levelsConsumed:
      type: "integer"
      minimum: 0
    levels:
      type: "array"
      items:
        $ref: "#/RoutePreviewLevel"
    covers:
      type: "boolean"
      description: True when the venue's book inside the bound carries the whole size alone.
    coveredSize:
      $ref: "./primitives.yaml#/DecStr"
RoutePreviewLeg:
  type: "object"
  description: "One leg of the smart route, walked on its venue's live book. Prices are USD per base unit; levels are in the venue's own price and size units."
  additionalProperties: false
  required:
    - "size"
    - "baseSize"
    - "limitPrice"
    - "touchPrice"
    - "avgPrice"
    - "slippageBps"
    - "notionalUsd"
    - "venueFeeRate"
    - "venueFeeUsd"
    - "ourFeeRate"
    - "ourFeeUsd"
    - "fundingUsd"
    - "allInUsd"
    - "allInPrice"
    - "levelsConsumed"
    - "levels"
    - "legNo"
    - "venue"
    - "instrumentId"
    - "bookSnapshotId"
    - "bookAgeMs"
  properties:
    size:
      $ref: "./primitives.yaml#/DecStr"
    baseSize:
      $ref: "./primitives.yaml#/DecStr"
    limitPrice:
      $ref: "./primitives.yaml#/DecStr"
    touchPrice:
      $ref: "./primitives.yaml#/DecStr"
    avgPrice:
      $ref: "./primitives.yaml#/DecStr"
    slippageBps:
      $ref: "./primitives.yaml#/DecStr"
    notionalUsd:
      $ref: "./primitives.yaml#/DecStr"
    venueFeeRate:
      $ref: "./primitives.yaml#/DecStr"
    venueFeeUsd:
      $ref: "./primitives.yaml#/DecStr"
    ourFeeRate:
      $ref: "./primitives.yaml#/DecStr"
    ourFeeUsd:
      $ref: "./primitives.yaml#/DecStr"
    fundingUsd:
      $ref: "./primitives.yaml#/DecStr"
    allInUsd:
      $ref: "./primitives.yaml#/DecStr"
    allInPrice:
      $ref: "./primitives.yaml#/DecStr"
    levelsConsumed:
      type: "integer"
      minimum: 0
    levels:
      type: "array"
      items:
        $ref: "#/RoutePreviewLevel"
    legNo:
      type: "integer"
      minimum: 1
