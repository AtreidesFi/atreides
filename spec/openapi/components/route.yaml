RoutePreviewFunding:
  type: "object"
  description: Expected carry for settlements after the quote and through the end of the holding horizon. A positive carry is a cost to the side.
  additionalProperties: false
  required: ["intervalS", "rateNow", "rateMean7d", "known", "carryFraction", "carryUsd"]
  properties:
    intervalS:
      type: "integer"
      minimum: 1
    rateNow:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    rateMean7d:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    known:
      type: "boolean"
    settlements:
      oneOf: [{ "type": "integer", "minimum": 0 }, { "type": "null" }]
    nextFundingAt:
      oneOf: [{ "$ref": "./primitives.yaml#/Instant" }, { "type": "null" }]
    carryFraction:
      description: The contribution of available forecast inputs. When known is false, this value may omit unsettled inputs.
      $ref: "./primitives.yaml#/DecStr"
    carryUsd:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
RoutePreviewVenue:
  type: "object"
  additionalProperties: false
  required: ["venue", "instrumentId", "cls", "status", "skip", "book", "venueFee", "single", "funding", "inSmartRoute"]
  properties:
    venue:
      $ref: "#/RoutePreviewVenueId"
    instrumentId:
      oneOf: [{ "type": "string" }, { "type": "null" }]
    cls:
      oneOf: [{ "$ref": "./primitives.yaml#/InstrumentClass" }, { "type": "null" }]
    status:
      type: "string"
      enum: ["quoted", "skipped"]
    skip:
      oneOf:
        - type: "object"
          additionalProperties: false
          required: ["reason", "detail"]
          properties:
            reason:
              $ref: "#/RoutePreviewSkipReason"
            detail:
              oneOf: [{ "type": "string" }, { "type": "null" }]
        - type: "null"
    book:
      oneOf: [{ "$ref": "#/RoutePreviewBook" }, { "type": "null" }]
    venueFee:
      oneOf: [{ "$ref": "#/RoutePreviewVenueFee" }, { "type": "null" }]
    single:
      oneOf: [{ "$ref": "#/RoutePreviewSingle" }, { "type": "null" }]
    funding:
      oneOf: [{ "$ref": "#/RoutePreviewFunding" }, { "type": "null" }]
    inSmartRoute:
      type: "boolean"
RoutePreview:
  type: "object"
  description: |
    An indicative quote: real live books and public fee schedules, no account, no balance, no reservation. It places,
    signs and writes nothing, and carries nothing an order could be built from.
  additionalProperties: false
  required:
    - "indicative"
    - "executable"
    - "asOf"
    - "status"
    - "message"
    - "request"
    - "quotedVenues"
    - "bestSingle"
    - "smartRoute"
    - "saving"
    - "venues"
    - "skipped"
    - "assumptions"
  properties:
    indicative:
      type: "boolean"
      const: true
    executable:
      type: "boolean"
      const: false
    asOf:
      $ref: "./primitives.yaml#/Instant"
    status:
      type: "string"
      enum: ["smart_route", "single_venue", "no_quote"]
    message:
      type: "string"
    request:
      type: "object"
      additionalProperties: false
      required:
        - "group"
        - "side"
        - "type"
        - "size"
        - "notional"
        - "limitPrice"
        - "maxSlippageBps"
        - "fundingHorizonHours"
        - "split"
        - "maxLegs"
        - "ourFeeOrigin"
        - "ourFeeTier"
        - "venues"
      properties:
        group:
          type: "string"
        side:
          type: "string"
          enum: ["buy", "sell"]
        type:
          type: "string"
          enum: ["market", "limit"]
        size:
          $ref: "./primitives.yaml#/DecStr"
        notional:
          oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
        limitPrice:
          oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
        maxSlippageBps:
          oneOf: [{ "type": "integer" }, { "type": "null" }]
        fundingHorizonHours:
          oneOf: [{ "type": "integer" }, { "type": "null" }]
        split:
          type: "boolean"
        maxLegs:
          type: "integer"
        ourFeeOrigin:
          type: "string"
          enum: ["algo", "manual"]
        ourFeeTier:
          type: "string"
          const: "base"
        venues:
          type: "array"
          items:
            $ref: "#/RoutePreviewVenueId"
    quotedVenues:
      type: "integer"
      minimum: 0
    bestSingle:
      oneOf:
        - type: "object"
          additionalProperties: false
          required: ["venue", "instrumentId", "allInPrice", "allInUsd"]
          properties:
            venue:
              $ref: "#/RoutePreviewVenueId"
            instrumentId:
              type: "string"
            allInPrice:
              $ref: "./primitives.yaml#/DecStr"
            allInUsd:
              $ref: "./primitives.yaml#/DecStr"
        - type: "null"
    smartRoute:
      oneOf:
        - type: "object"
          additionalProperties: false
          required:
            - "legs"
            - "coveredSize"
            - "uncoveredSize"
            - "arrivalPrice"
            - "worstPrice"
            - "totals"
            - "planSha256"
          properties:
            splitDecision:
              oneOf: [{ "$ref": "#/SplitDecision" }, { "type": "null" }]
            splitGainBps:
              description: The gain the split decision compared with its threshold. Returned for anonymous previews when a comparable split was evaluated.
              oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
            legs:
              type: "array"
              items:
                $ref: "#/RoutePreviewLeg"
            coveredSize:
              $ref: "./primitives.yaml#/DecStr"
            uncoveredSize:
              $ref: "./primitives.yaml#/DecStr"
            arrivalPrice:
              $ref: "./primitives.yaml#/DecStr"
            worstPrice:
              $ref: "./primitives.yaml#/DecStr"
            totals:
              type: "object"
              additionalProperties: false
              required: ["notionalUsd", "venueFeeUsd", "ourFeeUsd", "fundingUsd", "allInUsd", "allInPrice"]
              properties:
                notionalUsd:
                  $ref: "./primitives.yaml#/DecStr"
                venueFeeUsd:
                  $ref: "./primitives.yaml#/DecStr"
                ourFeeUsd:
                  $ref: "./primitives.yaml#/DecStr"
                fundingUsd:
                  $ref: "./primitives.yaml#/DecStr"
                fundingKnown:
                  type: "boolean"
                  description: Whether all selected legs could price the requested funding horizon. Returned for anonymous previews.
                allInUsd:
                  $ref: "./primitives.yaml#/DecStr"
                allInPrice:
                  $ref: "./primitives.yaml#/DecStr"
            planSha256:
              type: "string"
        - type: "null"
    bestFullSingle:
      description: Best single-venue quote covering the requested size within the price bound, allowing rounding dust. Returned for anonymous previews.
      oneOf:
        - type: "object"
          additionalProperties: false
          required: ["venue", "allInPrice"]
          properties:
            venue:
              $ref: "#/RoutePreviewVenueId"
            allInPrice:
              $ref: "./primitives.yaml#/DecStr"
        - type: "null"
    saving:
      oneOf:
        - type: "object"
          additionalProperties: false
          required: ["bps", "usd", "versus"]
          properties:
            bps:
              $ref: "./primitives.yaml#/DecStr"
            usd:
              $ref: "./primitives.yaml#/DecStr"
            versus:
              $ref: "#/RoutePreviewVenueId"
        - type: "null"
    venues:
      type: "array"
      items:
        $ref: "#/RoutePreviewVenue"
    skipped:
      type: "array"
      items:
        type: "object"
        additionalProperties: false
        required: ["venue", "reason", "detail"]
        properties:
          venue:
            $ref: "#/RoutePreviewVenueId"
          reason:
            $ref: "#/RoutePreviewSkipReason"
          detail:
            oneOf: [{ "type": "string" }, { "type": "null" }]
    assumptions:
      type: "array"
      items:
        type: "string"
