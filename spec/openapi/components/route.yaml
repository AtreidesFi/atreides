# Route wire contract, 03 §8. Public prices and money use exact decimal strings.
RouteRequestBody:
  type: "object"
  additionalProperties: false
  required: ["group", "side", "type"]
  properties:
    group:
      type: "string"
      minLength: 1
      maxLength: 128
    side:
      type: "string"
      enum: ["buy", "sell"]
    type:
      type: "string"
      enum: ["limit", "market"]
    tif:
      type: "string"
      enum: ["ioc", "gtc", "post_only"]
    price:
      $ref: "./primitives.yaml#/DecStr"
    size:
      $ref: "./primitives.yaml#/DecStr"
    notional:
      $ref: "./primitives.yaml#/DecStr"
    reduceOnly:
      type: "boolean"
    maxSlippageBps:
      type: "integer"
      minimum: 1
      maximum: 2000
    tp:
      $ref: "./orders.yaml#/TriggerJson"
    sl:
      $ref: "./orders.yaml#/TriggerJson"
    fundingHorizonHours:
      type: "integer"
      minimum: 1
      maximum: 8760
    split:
      type: "boolean"
    maxLegs:
      type: "integer"
      minimum: 1
      maximum: 8
    crossClass:
      type: "boolean"
    allowPartial:
      type: "boolean"
    onShortfall:
      type: "string"
      enum: ["keep", "unwind"]
      description: "Defaults to keep. Unwind is available for server-routed perpetual openings without attached triggers when allowPartial is false."
    accountIds:
      type: "array"
      items:
        $ref: "./primitives.yaml#/Uuid"
      minItems: 1
      maxItems: 100
      uniqueItems: true
    mode:
      type: "string"
      enum: ["gateway", "direct"]
  oneOf:
    [
      { "required": ["size"], "not": { "required": ["notional"] } },
      { "required": ["notional"], "not": { "required": ["size"] } },
    ]
  allOf:
    # Reject limits without a price and size, or with market-only fields.
    - not:
        properties:
          type: { const: "limit" }
        anyOf:
          - not: { required: ["price", "size"] }
          - required: ["notional"]
          - required: ["maxSlippageBps"]
    # Reject market orders with a price or an explicit time in force other than IOC.
    - not:
        properties:
          type: { const: "market" }
        anyOf:
          - required: ["price"]
          - required: ["tif"]
            properties:
              tif: { not: { const: "ioc" } }
RoutedOrder:
  type: "object"
  additionalProperties: false
  required: ["group", "side", "type", "route", "clientRouteId"]
  properties:
    group:
      type: "string"
      minLength: 1
      maxLength: 128
    side:
      type: "string"
      enum: ["buy", "sell"]
    type:
      type: "string"
      enum: ["limit", "market"]
    tif:
      type: "string"
      enum: ["ioc", "gtc", "post_only"]
    price:
      $ref: "./primitives.yaml#/DecStr"
    size:
      $ref: "./primitives.yaml#/DecStr"
    notional:
      $ref: "./primitives.yaml#/DecStr"
    reduceOnly:
      type: "boolean"
    maxSlippageBps:
      type: "integer"
      minimum: 1
      maximum: 2000
    tp:
      $ref: "./orders.yaml#/TriggerJson"
    sl:
      $ref: "./orders.yaml#/TriggerJson"
    fundingHorizonHours:
      type: "integer"
      minimum: 1
      maximum: 8760
    split:
      type: "boolean"
    maxLegs:
      type: "integer"
      minimum: 1
      maximum: 8
    crossClass:
      type: "boolean"
    allowPartial:
      type: "boolean"
    onShortfall:
      type: "string"
      enum: ["keep", "unwind"]
      description: "Defaults to keep. Unwind requests a separate protective close after all available execution waves."
    accountIds:
      type: "array"
      items:
        $ref: "./primitives.yaml#/Uuid"
      minItems: 1
      maxItems: 100
      uniqueItems: true
    mode:
      type: "string"
      enum: ["gateway", "direct"]
    route:
      const: "best"
    clientRouteId:
      $ref: "./primitives.yaml#/ClientOrderId"
    quoteId:
      type: "string"
      minLength: 1
      maxLength: 16384
    replan:
      type: "integer"
      minimum: 1
      maximum: 2
  oneOf:
    [
      { "required": ["size"], "not": { "required": ["notional"] } },
      { "required": ["notional"], "not": { "required": ["size"] } },
    ]
  allOf:
    # Reject limits without a price and size, or with market-only fields.
    - not:
        properties:
          type: { const: "limit" }
        anyOf:
          - not: { required: ["price", "size"] }
          - required: ["notional"]
          - required: ["maxSlippageBps"]
    # Reject market orders with a price or an explicit time in force other than IOC.
    - not:
        properties:
          type: { const: "market" }
        anyOf:
          - required: ["price"]
          - required: ["tif"]
            properties:
              tif: { not: { const: "ioc" } }
RouteQuoteRequest:
  type: "object"
  additionalProperties: false
  properties:
    group:
      type: "string"
      minLength: 1
      maxLength: 128
    side:
      type: "string"
      enum: ["buy", "sell"]
    type:
      type: "string"
      enum: ["limit", "market"]
    tif:
      type: "string"
      enum: ["ioc", "gtc", "post_only"]
    price:
      $ref: "./primitives.yaml#/DecStr"
    size:
      $ref: "./primitives.yaml#/DecStr"
    notional:
      $ref: "./primitives.yaml#/DecStr"
    reduceOnly:
      type: "boolean"
    maxSlippageBps:
      type: "integer"
      minimum: 1
      maximum: 2000
    tp:
      $ref: "./orders.yaml#/TriggerJson"
    sl:
      $ref: "./orders.yaml#/TriggerJson"
    fundingHorizonHours:
      type: "integer"
      minimum: 1
      maximum: 8760
    split:
      type: "boolean"
    maxLegs:
      type: "integer"
      minimum: 1
      maximum: 8
    crossClass:
      type: "boolean"
    allowPartial:
      type: "boolean"
    accountIds:
      type: "array"
      items:
        $ref: "./primitives.yaml#/Uuid"
      minItems: 1
      maxItems: 100
      uniqueItems: true
    mode:
      type: "string"
      enum: ["gateway", "direct"]
    routeId:
      $ref: "./primitives.yaml#/Uuid"
  oneOf:
    [
      { "$ref": "#/RouteRequestBody" },
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["routeId"],
        "properties": { "routeId": { "$ref": "./primitives.yaml#/Uuid" } },
      },
    ]
RouteState:
  type: "string"
  enum: ["planned", "sending", "working", "done", "partial", "failed", "cancelled"]
RouteDropReason:
  type: "string"
  enum:
    [
      "stale_book",
      "unit_not_open",
      "market_closed",
      "fee_not_approved",
      "no_capacity",
      "below_minimum",
      "depeg",
      "cost_unknown",
      "no_ioc",
      "kill_switch",
      "class_not_selected",
      "no_fill_id",
      "venue_congested",
    ]
RouteVenueFeeEvidence:
  type: "object"
  additionalProperties: false
  required: ["source", "observedAt", "maker", "taker"]
  properties:
    source:
      type: "string"
      enum: ["account", "public_table"]
    observedAt:
      oneOf: [{ "$ref": "./primitives.yaml#/Instant" }, { "type": "null" }]
    maker:
      $ref: "./primitives.yaml#/DecStr"
    taker:
      $ref: "./primitives.yaml#/DecStr"
RouteLatency:
  type: "object"
  additionalProperties: false
  required: ["ackP50Ms", "venueDelayMs", "volatilityBps1s", "driftBps", "driftUsd"]
  properties:
    ackP50Ms:
      oneOf: [{ "type": "integer", "minimum": 0 }, { "type": "null" }]
    venueDelayMs:
      type: "integer"
      minimum: 0
    volatilityBps1s:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    driftBps:
      $ref: "./primitives.yaml#/DecStr"
    driftUsd:
      $ref: "./primitives.yaml#/DecStr"
RoutePlanLeg:
  type: "object"
  additionalProperties: false
  required:
    [
      "legNo",
      "accountId",
      "venue",
      "instrumentId",
      "cls",
      "exposure",
      "keyPlace",
      "tif",
      "size",
      "limitPrice",
      "baseSize",
      "expectedPrice",
      "allInPrice",
      "notionalUsd",
      "venueRate",
      "ourRate",
      "venueFeeUsd",
      "ourFeeUsd",
      "gasUsd",
      "fundingUsd",
      "fundingKnown",
      "leverageAssumed",
    ]
  properties:
    venueFeeEvidence:
      oneOf: [{ "$ref": "#/RouteVenueFeeEvidence" }, { "type": "null" }]
    latency:
      $ref: "#/RouteLatency"
    legNo:
      type: "integer"
      minimum: 1
    accountId:
      $ref: "./primitives.yaml#/Uuid"
    venue:
      $ref: "./primitives.yaml#/VenueId"
    instrumentId:
      type: "string"
    cls:
      $ref: "./primitives.yaml#/InstrumentClass"
    exposure:
      type: "string"
      enum: ["perp", "spot"]
    keyPlace:
      $ref: "./primitives.yaml#/KeyPlace"
    tif:
      type: "string"
      enum: ["ioc", "fok", "gtc", "post_only"]
    size:
      $ref: "./primitives.yaml#/DecStr"
    limitPrice:
      $ref: "./primitives.yaml#/DecStr"
    baseSize:
      $ref: "./primitives.yaml#/DecStr"
    expectedPrice:
      $ref: "./primitives.yaml#/DecStr"
    allInPrice:
      $ref: "./primitives.yaml#/DecStr"
    notionalUsd:
      $ref: "./primitives.yaml#/DecStr"
    venueRate:
      $ref: "./primitives.yaml#/DecStr"
    ourRate:
      $ref: "./primitives.yaml#/DecStr"
    venueFeeUsd:
      $ref: "./primitives.yaml#/DecStr"
    ourFeeUsd:
      $ref: "./primitives.yaml#/DecStr"
    gasUsd:
      $ref: "./primitives.yaml#/DecStr"
    gasCostKnown:
      type: "boolean"
    quoteReference:
      type: "object"
      additionalProperties: false
      required: ["asset", "usdPerUnit", "state", "observedAt"]
      properties:
        asset:
          type: "string"
        usdPerUnit:
          $ref: "./primitives.yaml#/DecStr"
        state:
          type: "string"
          enum: ["fresh", "stale", "unconfigured"]
        observedAt:
          oneOf: [{ "$ref": "./primitives.yaml#/Instant" }, { "type": "null" }]
    fundingUsd:
      $ref: "./primitives.yaml#/DecStr"
    fundingKnown:
      type: "boolean"
    fundingSettlements:
      oneOf: [{ "type": "integer", "minimum": 0 }, { "type": "null" }]
    nextFundingAt:
      oneOf: [{ "$ref": "./primitives.yaml#/Instant" }, { "type": "null" }]
    leverageAssumed:
      type: "boolean"
RouteCandidateJson:
  type: "object"
  additionalProperties: false
  required:
    ["accountId", "venue", "instrumentId", "cls", "dropped", "alone", "fundingRateNow", "depthBase", "capacityBase"]
  properties:
    venueFeeEvidence:
      oneOf: [{ "$ref": "#/RouteVenueFeeEvidence" }, { "type": "null" }]
    executionHealth:
      type: "object"
      additionalProperties: false
      required: ["sampled", "rejected", "budget"]
      properties:
        sampled:
          type: "integer"
          minimum: 0
        rejected:
          type: "integer"
          minimum: 0
        budget:
          oneOf:
            - type: "null"
            - type: "object"
              additionalProperties: false
              required: ["available", "observedAt"]
              properties:
                available:
                  type: "integer"
                  minimum: 0
                observedAt:
                  $ref: "./primitives.yaml#/Instant"
    accountId:
      $ref: "./primitives.yaml#/Uuid"
    venue:
      $ref: "./primitives.yaml#/VenueId"
    instrumentId:
      type: "string"
    cls:
      $ref: "./primitives.yaml#/InstrumentClass"
    dropped:
      oneOf:
        [
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["reason", "detail"],
            "properties":
              {
                "reason": { "$ref": "#/RouteDropReason" },
                "detail": { "oneOf": [{ "type": "string" }, { "type": "null" }] },
              },
          },
          { "type": "null" },
        ]
    alone:
      oneOf:
        [
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["baseSize", "allInPrice", "allInUsd"],
            "properties":
              {
                "baseSize": { "$ref": "./primitives.yaml#/DecStr" },
                "allInPrice": { "$ref": "./primitives.yaml#/DecStr" },
                "allInUsd": { "$ref": "./primitives.yaml#/DecStr" },
              },
          },
          { "type": "null" },
        ]
    fundingRateNow:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    depthBase:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    capacityBase:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    bandCentre:
      description: >-
        What the opening band is centred on: the venue mark (fresh), or the book mid when the mark was silent but the
        book is fresh and its spread is within the band. Null on a close or when no band was built.
      oneOf: [{ "type": "string", "enum": ["mark", "book_mid"] }, { "type": "null" }]
    markAgeMs:
      description: Age of the venue mark when the route was planned, in milliseconds; null when the venue gave none.
      oneOf: [{ "type": "integer", "minimum": 0 }, { "type": "null" }]
SplitDecision:
  type: "object"
  additionalProperties: false
  required: ["chosen", "reason", "considered", "maxVenues", "splitMarginBps"]
  properties:
    chosen:
      type: "string"
      enum: ["single", "split"]
    reason:
      type: "string"
      enum:
        [
          "split_clears_threshold",
          "below_threshold",
          "only_way_to_cover",
          "single_only",
          "split_off",
          "max_venues",
          "reduce_only",
          "no_close_book",
          "margin_unavailable",
          "test_share_cap",
        ]
    maxVenues:
      type: "integer"
      minimum: 1
      maximum: 8
    splitMarginBps:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    considered:
      oneOf:
        - type: "object"
          additionalProperties: false
          required: ["legs", "exitCostBps", "fundingDeltaBps", "fragmentationBps", "thresholdBps"]
          properties:
            legs:
              type: "integer"
              minimum: 2
              maximum: 8
            exitCostBps:
              $ref: "./primitives.yaml#/DecStr"
            fundingDeltaBps:
              oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
            fragmentationBps:
              $ref: "./primitives.yaml#/DecStr"
            thresholdBps:
              $ref: "./primitives.yaml#/DecStr"
        - type: "null"
RoutePlan:
  type: "object"
  additionalProperties: false
  required:
    [
      "execution",
      "legs",
      "coveredSize",
      "uncoveredSize",
      "dust",
      "worstPrice",
      "arrivalPrice",
      "totals",
      "bestSingle",
      "savingBps",
      "savingUsd",
      "unconstrained",
      "candidates",
      "planSha256",
    ]
  properties:
    splitDecision:
      oneOf: [{ "$ref": "#/SplitDecision" }, { "type": "null" }]
    execution:
      type: "string"
      enum: ["server", "client"]
    legs:
      type: "array"
      items:
        $ref: "#/RoutePlanLeg"
    coveredSize:
      $ref: "./primitives.yaml#/DecStr"
    uncoveredSize:
      $ref: "./primitives.yaml#/DecStr"
    dust:
      $ref: "./primitives.yaml#/DecStr"
    worstPrice:
      $ref: "./primitives.yaml#/DecStr"
    arrivalPrice:
      $ref: "./primitives.yaml#/DecStr"
    totals:
      type: "object"
      additionalProperties: false
      required: ["notionalUsd", "venueFeeUsd", "ourFeeUsd", "gasUsd", "fundingUsd", "allInUsd", "allInPrice"]
      properties:
        notionalUsd:
          $ref: "./primitives.yaml#/DecStr"
        venueFeeUsd:
          $ref: "./primitives.yaml#/DecStr"
        ourFeeUsd:
          $ref: "./primitives.yaml#/DecStr"
        gasUsd:
          $ref: "./primitives.yaml#/DecStr"
        fundingUsd:
          $ref: "./primitives.yaml#/DecStr"
        allInUsd:
          $ref: "./primitives.yaml#/DecStr"
        allInPrice:
          $ref: "./primitives.yaml#/DecStr"
    bestSingle:
      oneOf:
        [
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["accountId", "venue", "instrumentId", "allInUsd", "allInPrice"],
            "properties":
              {
                "accountId": { "$ref": "./primitives.yaml#/Uuid" },
                "venue": { "$ref": "./primitives.yaml#/VenueId" },
                "instrumentId": { "type": "string" },
                "allInUsd": { "$ref": "./primitives.yaml#/DecStr" },
                "allInPrice": { "$ref": "./primitives.yaml#/DecStr" },
              },
          },
          { "type": "null" },
        ]
    savingBps:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    savingUsd:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    unconstrained:
      oneOf:
        [
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["savingBps", "accountId", "venue", "moreUsd"],
            "properties":
              {
                "savingBps": { "$ref": "./primitives.yaml#/DecStr" },
                "accountId": { "$ref": "./primitives.yaml#/Uuid" },
                "venue": { "$ref": "./primitives.yaml#/VenueId" },
                "moreUsd": { "$ref": "./primitives.yaml#/DecStr" },
              },
          },
          { "type": "null" },
        ]
    candidates:
      type: "array"
      items:
        $ref: "#/RouteCandidateJson"
    planSha256:
      type: "string"
      pattern: "^[0-9a-f]{64}$"
RouteQuote:
  type: "object"
  additionalProperties: false
  required: ["plan", "quoteId", "validUntil"]
  properties:
    plan:
      $ref: "#/RoutePlan"
    quoteId:
      type: "string"
      minLength: 1
    validUntil:
      $ref: "./primitives.yaml#/Instant"
RouteLeg:
  type: "object"
  additionalProperties: false
  required:
    [
      "replan",
      "legNo",
      "accountId",
      "venue",
      "instrumentId",
      "cls",
      "keyPlace",
      "place",
      "clientOrderId",
      "venueClientId",
      "tif",
      "size",
      "limitPrice",
      "baseSize",
      "ourRate",
      "state",
      "placeBefore",
      "filledSize",
      "filledBaseSize",
      "avgPrice",
      "resultCode",
      "order",
    ]
  properties:
    venueFeeEvidence:
      oneOf: [{ "$ref": "#/RouteVenueFeeEvidence" }, { "type": "null" }]
    latency:
      $ref: "#/RouteLatency"
    replan:
      type: "integer"
      minimum: 0
    legNo:
      type: "integer"
      minimum: 1
    accountId:
      $ref: "./primitives.yaml#/Uuid"
    venue:
      $ref: "./primitives.yaml#/VenueId"
    instrumentId:
      type: "string"
    cls:
      $ref: "./primitives.yaml#/InstrumentClass"
    keyPlace:
      $ref: "./primitives.yaml#/KeyPlace"
    place:
      type: "string"
      enum: ["gateway", "intent", "relay", "wallet", "direct"]
    clientOrderId:
      $ref: "./primitives.yaml#/ClientOrderId"
    venueClientId:
      type: "string"
    tif:
      type: "string"
      enum: ["ioc", "fok", "gtc", "post_only"]
    size:
      $ref: "./primitives.yaml#/DecStr"
    limitPrice:
      $ref: "./primitives.yaml#/DecStr"
    baseSize:
      $ref: "./primitives.yaml#/DecStr"
    ourRate:
      $ref: "./primitives.yaml#/DecStr"
    state:
      type: "string"
      enum: ["reserved", "placed", "released", "lapsed"]
    placeBefore:
      $ref: "./primitives.yaml#/Instant"
    filledSize:
      $ref: "./primitives.yaml#/DecStr"
    filledBaseSize:
      $ref: "./primitives.yaml#/DecStr"
    avgPrice:
      oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
    resultCode:
      oneOf: [{ "type": "string" }, { "type": "null" }]
    markouts:
      type: "array"
      description: Post-fill price movement by horizon. A positive value favours the order side. A partial sample has no leg-wide result.
      items:
        type: "object"
        additionalProperties: false
        required: ["horizonSeconds", "bps", "sampledFills", "totalFills", "observedAt", "reference", "calculatedAt"]
        properties:
          horizonSeconds:
            type: "integer"
            enum: [1, 5, 30]
          bps:
            oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
          sampledFills:
            type: "integer"
            minimum: 0
          totalFills:
            type: "integer"
            minimum: 1
          observedAt:
            oneOf: [{ "$ref": "./primitives.yaml#/Instant" }, { "type": "null" }]
          reference:
            oneOf: [{ "type": "string", "enum": ["mid", "mark", "mixed"] }, { "type": "null" }]
          calculatedAt:
            $ref: "./primitives.yaml#/Instant"
    order:
      oneOf: [{ "$ref": "./orders.yaml#/Order" }, { "type": "null" }]
RouteReport:
  type: "object"
  additionalProperties: false
  required:
    [
      "arrivalPrice",
      "filledSize",
      "filledNotionalUsd",
      "gasUsd",
      "refundUsd",
      "vwap",
      "slippageBps",
      "venueFeesUsd",
      "ourFeesUsd",
      "expectedFundingUsd",
      "benchmarkPrice",
      "realisedAllInPrice",
      "netSavingBps",
      "netSavingUsd",
      "planSavingBps",
      "legsSent",
      "replans",
      "msToComplete",
      "provisional",
      "byVenue",
    ]
  properties:
    splitDecision:
      oneOf: [{ "$ref": "#/SplitDecision" }, { "type": "null" }]
    marginedPerVenue:
      type: "boolean"
    savingParts:
      type: "object"
      additionalProperties: false
      required: ["benchmarkNotionalUsd", "execution", "fundingForecast", "exclusions"]
      properties:
        benchmarkNotionalUsd:
          oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
        execution:
          type: "object"
          additionalProperties: false
          required: ["status", "usd", "bps"]
          properties:
            status:
              enum: ["pending", "final"]
              type: "string"
            usd:
              oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
            bps:
              oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
        fundingForecast:
          type: "object"
          additionalProperties: false
          required: ["usd", "bps"]
          properties:
            usd:
              oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
            bps:
              oneOf: [{ "$ref": "./primitives.yaml#/DecStr" }, { "type": "null" }]
        exclusions:
          type: "array"
          items:
            type: "string"
            enum:
              ["no_fills", "open_route", "provisional_fill", "unrecorded_fills", "unknown_paid_fees", "no_benchmark"]
    arrivalPrice:
      $ref: "./primitives.yaml#/DecStr"
    filledSize:
