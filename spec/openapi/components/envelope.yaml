# The envelope of every answer (01 A15, §5.12 rule 5; 03 §6.1). A success is { ok: true, data }; a decided refusal is
# HTTP 200 with the Refusal body; a transport error carries the same body with its HTTP status.
Ok:
  type: object
  description: >-
    A success. An operation's answer is this envelope with `data` narrowed to its own schema, as
    `allOf: [Ok, { type: object, required: [data], properties: { data: <schema> } }]`, or `oneOf` that and Refusal.
  required: [ok, data]
  properties:
    ok:
      const: true
    data: {}
OkList:
  type: object
  description: >-
    A page of a list, newest first unless the operation says otherwise. Pass `nextCursor` as `cursor` for the next
    page; it is null on the last page. An operation narrows `data.items` the same way as Ok.
  required: [ok, data, nextCursor]
  properties:
    ok:
      const: true
    data:
      type: array
      items: {}
    nextCursor:
      type: [string, "null"]
      description: Opaque. Valid for the same operation and filters as long as its rows exist.
Refusal:
  type: object
  description: A refusal or an error. `code` names the cause, `message` says how to fix it; map the code, not the text.
  required: [ok, code, message, retryable, requestId]
  properties:
    ok:
      const: false
    code:
      $ref: "#/ErrorCode"
    message:
      type: string
    retryable:
      type: boolean
      description: True when the same request may succeed later unchanged.
    details:
      type: object
      description: The values the message was filled from.
      additionalProperties:
        type: [string, number, boolean, "null"]
    requestId:
      type: string
      description: Equals the X-Request-Id header of the answer; quote it when asking for help.
# BEGIN ErrorCode: generated error code enumeration.
