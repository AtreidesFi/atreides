                  cappedBy: null
                reconciliation:
                  state: reconciled
                  venueDay: 2026-11-07
                rewards:
                  referral:
                    amount: "0.0065"
                    asset: usdc
                  state: claimable
feesSummary:
  get:
    operationId: summarizeFees
    summary: Sum the fees paid by venue, split into the venue's part and ours.
    tags:
      - Reads
    x-owner: "03"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - invalid_request
    x-mcp-tool:
      name: my_fees
      description: Sum the fees paid in a period by venue, split into the venue's part and ours.
    security:
      - session: []
      - apiKey: []
    parameters:
      - name: from
        in: query
        required: true
        description: Start of the period.
        schema:
          $ref: ../components/primitives.yaml#/Instant
      - name: to
        in: query
        required: true
        description: End of the period.
        schema:
          $ref: ../components/primitives.yaml#/Instant
    responses:
      "200":
        description: Fees by venue.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/reads.yaml#/FeesSummary
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                byVenue:
                  - venue: hyperliquid
                    notional:
                      amount: "650"
                      asset: usdc
                    venueFees:
                      - amount: "0.2275"
                        asset: usdc
                    ourFees:
                      - amount: "0.0325"
                        asset: usdc
                    fills: 1
equity:
  get:
    operationId: getEquity
    summary: Read current and daily equity.
    description: Current equity comes through the gateway; daily equity from snapshots. `from` and `to` are UTC days.
    tags:
      - Reads
    x-owner: "03"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - account_not_bound
    x-mcp-tool:
      name: my_equity
      description: "Read the user's equity by venue; an unreadable venue makes the total unavailable."
    security:
      - session: []
      - apiKey: []
    parameters:
      - $ref: ../components/parameters.yaml#/AccountId
      - name: from
        in: query
        required: false
        description: First day.
        schema:
          $ref: ../components/reads.yaml#/UtcDay
      - name: to
        in: query
        required: false
        description: Last day.
        schema:
          $ref: ../components/reads.yaml#/UtcDay
    responses:
      "200":
        description: Equity.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/reads.yaml#/EquityView
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                current:
                  - accountId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d10
                    venue: hyperliquid
                    read:
                      ok: true
                      value:
                        amount: "1000"
                        asset: usdc
                      asOf: 2026-11-07T09:30:00.000Z
                daily:
                  - day: 2026-11-06
                    accountId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d10
                    equity:
                      amount: "990"
                      asset: usdc
                    source: snapshot
