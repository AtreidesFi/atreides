standings:
  parameters:
    - name: competitionId
      in: path
      required: true
      description: The competition.
      schema:
        $ref: ../components/primitives.yaml#/Uuid
  get:
    operationId: getStandings
    x-owner: "11"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: competitions.enabled
    x-refusals:
      - not_found
      - feature_unavailable
      - cursor_invalid
    summary: Read the standings.
    description: "A page of ranked rows of one snapshot. `nextCursor` pages `data.rows`. Default snapshot: the latest."
    tags:
      - Community
    security:
      - {}
      - session: []
      - apiKey: []
    parameters:
      - name: day
        in: query
        required: false
        description: The snapshot day; default the latest.
        schema:
          $ref: ../components/competitions.yaml#/Day
      - name: kind
        in: query
        required: false
        description: The snapshot kind; default the latest of the day.
        schema:
          $ref: ../components/competitions.yaml#/SnapshotKind
      - name: division
        in: query
        required: false
        description: Only this division.
        schema:
          type: string
          maxLength: 64
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200":
        description: "The answer, or a decided refusal (HTTP 200 with `ok: false`)."
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                    - nextCursor
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/competitions.yaml#/StandingsPage
                    nextCursor:
                      type:
                        - string
                        - "null"
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                snapshot:
                  day: 2026-11-06
                  kind: daily
                  sha256: a3f1c0d2e4b5968778695a4b3c2d1e0f9a8b7c6d5e4f30211203948576a5b4c3
                  cutoffAt: 2026-11-07T09:30:00.000Z
                rows:
                  - rank: 1
                    token: k7Hq2mXa9Lp3
                    displayName: northwind
                    division: null
                    score: "1.8423"
                    totalReturn: "0.2150"
                    maxDrawdown: "0.0980"
                    observationDays: 6
                    activeDays: 6
              nextCursor: null
      default:
        description: A transport error (401, 403, 404, 429, 5xx) with the same body as a refusal.
