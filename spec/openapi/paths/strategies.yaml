kill:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: ../components/primitives.yaml#/Uuid
  post:
    operationId: killStrategy
    summary: Kill a strategy, pausing its live runs and stopping its paper runs.
    description: >-
      Always succeeds and is idempotent. A session or an API key with `read` may kill; a `trade` key only when bound to the account of one of the strategy's gateway runs (`account_not_bound` otherwise).
    tags:
      - Lab
    x-owner: "09"
    x-scope: read
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - feature_unavailable
      - idempotency_conflict
    x-flag: strategies.enabled
    security:
      - session: []
      - apiKey: []
    parameters:
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/lab.yaml#/KillRequest
          example:
            reason: market stress
    responses:
      "200":
        description: The answer, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/lab.yaml#/KillResult
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                strategy:
                  id: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  number: 7
                  name: BTC mean reversion
                  kind: bot
                  status: active
                  originDoor: api
                  derivedFromCardSlug: null
                  currentVersion: 1
                  currentVersionId: 01936f2e-7c3b-7b1e-8d4f-2a9c5e6b7d81
                  killSwitch: false
                  killReason: null
                  headline: null
                  runs:
                    live: 0
                    paper: 0
                    lost: 0
                  createdAt: 2026-11-07T09:30:00.000Z
                  updatedAt: 2026-11-07T09:30:00.000Z
                  archivedAt: null
                runs: []
