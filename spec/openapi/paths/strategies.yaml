# Strategies and versions (09 §6.2). Runs, lab runs, follows and exports have their own path files (LB-T16, LB-T18).
strategies:
  get:
    operationId: listStrategies
    summary: List the user's strategies.
    description: >-
      Reads move no money. The caller sees only their own strategies. Lowest number first.
    tags:
      - Lab
    x-owner: "09"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals: []
    x-flag: strategies.enabled
    security:
      - session: []
      - apiKey: []
    parameters:
      - name: status
        in: query
        required: false
        description: Active strategies, or archived ones.
        schema:
          $ref: ../components/lab.yaml#/StrategyStatus
          default: active
      - name: kind
        in: query
        required: false
        description: Only this kind.
        schema:
          $ref: ../components/lab.yaml#/StrategyKind
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200":
        description: The answer, or a refusal.
        content:
          application/json:
            schema:
              type: object
              required:
                - ok
                - data
                - nextCursor
              properties:
                ok:
                  const: true
                data:
                  type: array
                  items:
                    $ref: ../components/lab.yaml#/StrategyView
                nextCursor:
                  type:
                    - string
                    - "null"
            example:
              ok: true
              data:
                - id: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  number: 7
                  name: BTC mean reversion
                  kind: bot
                  status: active
                  originDoor: api
                  derivedFromCardSlug: null
                  currentVersion: 1
                  currentVersionId: 01936f2e-7c3b-7b1e-8d4f-2a9c5e6b7d81
                  killSwitch: false
                  killReason: null
                  headline: null
                  runs:
                    live: 0
                    paper: 0
                    lost: 0
                  createdAt: 2026-11-07T09:30:00.000Z
                  updatedAt: 2026-11-07T09:30:00.000Z
                  archivedAt: null
              nextCursor: null
  post:
    operationId: createStrategy
    summary: Save a new strategy and its first version.
    description: >-
      Validates the whole spec; every problem comes back in one `lab_spec_invalid`. Lab objects move no money, so a `read` key may write them; an MCP token is refused `scope_missing`.
    tags:
      - Lab
    x-owner: "09"
    x-scope: read
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - lab_spec_invalid
      - feature_unavailable
      - idempotency_conflict
    x-flag: strategies.enabled
    security:
      - session: []
      - apiKey: []
    parameters:
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/lab.yaml#/CreateStrategyRequest
          example:
            name: BTC mean reversion
            spec:
              schema: strategy/v1
              kind: bot
              timeframe: 1s
              quoteAsset: usdc
              signals: {}
              limits:
                budget: "10000"
                maxOpenPositions: 3
                cooldownBars: 0
                maxTradesPerDay: 500
              universe:
                kind: list
                instruments:
                  - hyperliquid:BTC
              feeds:
                - bars
                - book
              marginMode: cross
            originDoor: api
            note: first draft
    responses:
      "200":
        description: The answer, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/lab.yaml#/StrategyCreated
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                strategy:
                  id: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  number: 7
                  name: BTC mean reversion
                  kind: bot
                  status: active
                  originDoor: api
                  derivedFromCardSlug: null
                  currentVersion: 1
                  currentVersionId: 01936f2e-7c3b-7b1e-8d4f-2a9c5e6b7d81
                  killSwitch: false
                  killReason: null
                  headline: null
                  runs:
                    live: 0
                    paper: 0
                    lost: 0
                  createdAt: 2026-11-07T09:30:00.000Z
                  updatedAt: 2026-11-07T09:30:00.000Z
                  archivedAt: null
                version:
                  id: 01936f2e-7c3b-7b1e-8d4f-2a9c5e6b7d81
                  strategyId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  version: 1
                  specSha256: "abababababababababababababababababababababababababababababababab"
                  engineVersion: strategy-engine/1
                  parentVersionId: null
                  createdVia: api
                  note: first draft
                  createdAt: 2026-11-07T09:30:00.000Z
                  spec:
                    schema: strategy/v1
                    kind: bot
                    timeframe: 1s
                    quoteAsset: usdc
                    signals: {}
                    limits:
                      budget: "10000"
                      maxOpenPositions: 3
                      cooldownBars: 0
                      maxTradesPerDay: 500
                    universe:
                      kind: list
                      instruments:
                        - hyperliquid:BTC
                    feeds:
                      - bars
                      - book
                    marginMode: cross
