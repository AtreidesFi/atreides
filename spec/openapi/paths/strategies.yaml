validate:
  post:
    operationId: validateStrategySpec
    summary: Check a spec without saving it.
    description: >-
      A validation answer, not a refusal: `data.ok` tells whether the spec is accepted. With a `window`, the answer adds the data coverage and a runtime estimate. Writes nothing.
    tags:
      - Lab
    x-owner: "09"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - feature_unavailable
    x-flag: strategies.enabled
    security:
      - session: []
      - apiKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/lab.yaml#/ValidateSpecRequest
          example:
            spec:
              schema: strategy/v1
              kind: bot
              timeframe: 1s
              quoteAsset: usdc
              signals: {}
              limits:
                budget: "10000"
                maxOpenPositions: 3
                cooldownBars: 0
                maxTradesPerDay: 500
              universe:
                kind: list
                instruments:
                  - hyperliquid:BTC
              feeds:
                - bars
                - book
              marginMode: cross
            forLive: false
    responses:
      "200":
        description: The answer, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/lab.yaml#/SpecValidation
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                ok: true
                sha256: "abababababababababababababababababababababababababababababababab"
                coverage: []
