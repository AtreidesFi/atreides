ownerChanges:
  parameters:
    - name: profileId
      in: path
      required: true
      description: The profile.
      schema:
        $ref: ../components/primitives.yaml#/Uuid
  post:
    operationId: requestProfileOwnerChange
    x-owner: "11"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - owner_change_pending
      - owner_change_signature_invalid
      - profile_not_owner
      - owner_change_target_has_personal
      - idempotency_conflict
    summary: Request an owner change.
    description: Starts the move of a profile to another wallet; takes effect after the cooling-off period once the new
      owner confirms.
    tags:
      - Community
    security:
      - session: []
    parameters:
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/community.yaml#/RequestOwnerChangeRequest
          example:
            toAddress: "0x1111111111111111111111111111111111111111"
            message: Move Northwind Traders to 0x1111111111111111111111111111111111111111
            signature:
              "0xababababababababababababababababababababababababababababababababababababababababababababababababababababa\
              babababababababababababab"
    responses:
      "200":
        description: "The answer, or a decided refusal (HTTP 200 with `ok: false`)."
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/community.yaml#/OwnerChange
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                id: 0193a040-7c3a-7b1e-8d4f-2a9c5e6b7d80
                profileId: 0193a020-7c3a-7b1e-8d4f-2a9c5e6b7d80
                toAddress: "0x1111111111111111111111111111111111111111"
                status: requested
                effectiveAt: null
      default:
        description: A transport error (401, 403, 404, 429, 5xx) with the same body as a refusal.
        content:
          application/json:
            schema:
              $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: false
              code: profile_not_owner
              message: Only the wallet that owns the profile can do this; sign in with it.
              retryable: false
              requestId: req_01936f2e7c3a
ownerChangeConfirm:
  parameters:
    - name: changeId
      in: path
      required: true
      description: The owner change.
      schema:
        $ref: ../components/primitives.yaml#/Uuid
  post:
    operationId: confirmProfileOwnerChange
    x-owner: "11"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - owner_change_signature_invalid
      - forbidden
      - not_found
      - idempotency_conflict
    summary: Confirm an owner change.
    description: The new owner signs the message we issued and confirms; the session must hold the target address.
    tags:
      - Community
    security:
      - session: []
    parameters:
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/community.yaml#/ConfirmOwnerChangeRequest
          example:
            message: Accept Northwind Traders
            signature:
              "0xababababababababababababababababababababababababababababababababababababababababababababababababababababa\
              babababababababababababab"
    responses:
      "200":
        description: "The answer, or a decided refusal (HTTP 200 with `ok: false`)."
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/community.yaml#/OwnerChange
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                id: 0193a040-7c3a-7b1e-8d4f-2a9c5e6b7d80
                profileId: 0193a020-7c3a-7b1e-8d4f-2a9c5e6b7d80
                toAddress: "0x1111111111111111111111111111111111111111"
                status: confirmed
                effectiveAt: 2026-11-09T09:30:00.000Z
      default:
        description: A transport error (401, 403, 404, 429, 5xx) with the same body as a refusal.
        content:
          application/json:
            schema:
              $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: false
              code: forbidden
              message: This credential may not do that.
              retryable: false
              requestId: req_01936f2e7c3a
