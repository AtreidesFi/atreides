# Community profile operations (x-owner '11'; 11 §13.4). Hand-maintained; every operation carries the extensions of 03 §13.2.
mine:
  get:
    operationId: listMyProfiles
    x-owner: "11"
    x-scope: session
    x-rate-class: read
    x-idempotency: none
    x-refusals: []
    summary: List my profiles.
    description: "The profiles the signed-in user owns: their personal profile and any community profile."
    tags:
      - Community
    security:
      - session: []
    responses:
      "200":
        description: "The answer, or a decided refusal (HTTP 200 with `ok: false`)."
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      type: array
                      items:
                        $ref: ../components/community.yaml#/ProfileSummary
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                - id: 0193a020-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  kind: community
                  slug: northwind-traders
                  displayName: Northwind Traders
                  status: active
      default:
        description: A transport error (401, 403, 404, 429, 5xx) with the same body as a refusal.
        content:
          application/json:
            schema:
              $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: false
              code: unauthenticated
              message: Sign in first.
              retryable: false
              requestId: req_01936f2e7c3a
profile:
  parameters:
    - name: profileId
      in: path
      required: true
      description: The profile.
      schema:
        $ref: ../components/primitives.yaml#/Uuid
  get:
    operationId: getProfile
    x-owner: "11"
    x-scope: session
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - profile_not_owner
      - not_found
    summary: Read one profile.
    description: "The owner view: members, volume and accrued referral share."
    tags:
      - Community
    security:
      - session: []
    responses:
      "200":
        description: "The answer, or a decided refusal (HTTP 200 with `ok: false`)."
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/community.yaml#/ProfileDetail
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                id: 0193a020-7c3a-7b1e-8d4f-2a9c5e6b7d80
                kind: community
                slug: northwind-traders
                displayName: Northwind Traders
                status: active
                memberCount: 128
                activeMembers30d: 61
                feePayingVolume30dUsd: "2840000"
                feePayingVolumeLifetimeUsd: "9120000"
                accruedShare:
                  - state: pending
                    amount:
                      amount: "42.10"
                      asset: usdc
                inviteLinks:
                  - code: northwind
                    usesLeft: 40
                    expiresAt: null
      default:
        description: A transport error (401, 403, 404, 429, 5xx) with the same body as a refusal.
        content:
          application/json:
            schema:
              $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: false
              code: profile_not_owner
              message: Only the wallet that owns the profile can do this; sign in with it.
              retryable: false
              requestId: req_01936f2e7c3a
  put:
    operationId: updateProfile
    x-owner: "11"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - profile_not_owner
      - display_name_invalid
      - idempotency_conflict
    summary: Rename a profile.
    description: Changes the profile's display name.
    tags:
      - Community
    security:
      - session: []
    parameters:
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/community.yaml#/UpdateProfileRequest
          example:
            displayName: Northwind Traders
    responses:
      "200":
        description: "The answer, or a decided refusal (HTTP 200 with `ok: false`)."
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/community.yaml#/ProfileDetail
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                id: 0193a020-7c3a-7b1e-8d4f-2a9c5e6b7d80
                kind: community
                slug: northwind-traders
                displayName: Northwind Traders
                status: active
                memberCount: 128
                activeMembers30d: 61
                feePayingVolume30dUsd: "2840000"
                feePayingVolumeLifetimeUsd: "9120000"
                accruedShare:
                  - state: pending
                    amount:
                      amount: "42.10"
                      asset: usdc
                inviteLinks:
                  - code: northwind
                    usesLeft: 40
                    expiresAt: null
      default:
        description: A transport error (401, 403, 404, 429, 5xx) with the same body as a refusal.
        content:
          application/json:
            schema:
              $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: false
              code: profile_not_owner
              message: Only the wallet that owns the profile can do this; sign in with it.
              retryable: false
              requestId: req_01936f2e7c3a
members:
  parameters:
    - name: profileId
      in: path
      required: true
      description: The profile.
      schema:
        $ref: ../components/primitives.yaml#/Uuid
  get:
    operationId: listProfileMembers
    x-owner: "11"
    x-scope: session
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - profile_not_owner
      - cursor_invalid
    summary: List a profile's members.
    description: Members by handle only, with their activity and fee-paying volume.
    tags:
      - Community
    security:
      - session: []
    parameters:
      - name: activeOnly
        in: query
        required: false
        description: Only members active in the last 30 days.
        schema:
          type: boolean
          default: false
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200":
        description: "The answer, or a decided refusal (HTTP 200 with `ok: false`)."
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                    - nextCursor
                  properties:
                    ok:
                      const: true
                    data:
                      type: array
                      items:
                        $ref: ../components/community.yaml#/ProfileMember
                    nextCursor:
                      type:
                        - string
                        - "null"
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                - handle: trader-4f2a
                  joinedAt: 2026-11-02T09:30:00.000Z
                  venuesActive30d: 2
                  feePayingVolume30dUsd: "18200"
                  feePayingVolumeLifetimeUsd: "44100"
              nextCursor: null
      default:
        description: A transport error (401, 403, 404, 429, 5xx) with the same body as a refusal.
        content:
          application/json:
            schema:
              $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: false
              code: profile_not_owner
              message: Only the wallet that owns the profile can do this; sign in with it.
              retryable: false
              requestId: req_01936f2e7c3a
