# Wallets (03 §4.6, §7.1). Owner 03.
# Operations only, no handlers (ORC-F01). Schemas are in ../components/.
wallets:
  get:
    operationId: listWallets
    summary: List the wallets linked to the user.
    tags:
      - Auth
    x-owner: "03"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals: []
    security:
      - session: []
      - apiKey: []
    responses:
      "200":
        description: The wallets.
        headers:
          X-Request-Id: &a1
            $ref: ../components/headers.yaml#/X-Request-Id
          RateLimit-Limit: &a2
            $ref: ../components/headers.yaml#/RateLimit-Limit
          RateLimit-Remaining: &a3
            $ref: ../components/headers.yaml#/RateLimit-Remaining
          RateLimit-Reset: &a4
            $ref: ../components/headers.yaml#/RateLimit-Reset
        content:
          application/json:
            schema:
              type: object
              required:
                - ok
                - data
              properties:
                ok:
                  const: true
                data:
                  type: array
                  items:
                    $ref: ../components/identity.yaml#/Wallet
            example:
              ok: true
              data:
                - &a5
                  walletId: 01936f2e-7c3b-7a52-9c10-5b8d3e4f6a21
                  address: "0x71c7656ec7ab88b098defb751b7401b5f6d8976f"
                  chain: evm
                  verifiedAt: 2026-11-07T09:30:00.000Z
                  isPayoutWallet: true
                  signInAllowed: true
  post:
    operationId: linkWallet
    summary: Link a wallet to the user.
    description: A SIWE proof over a `link_wallet` nonce issued to this session. A wallet of another user is never taken.
    tags:
      - Auth
    x-owner: "03"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - siwe_invalid
      - wallet_linked_elsewhere
      - blocked
    security: &a6
      - session: []
    parameters:
      - &a7
        $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/WalletProof
          example: &a8
            message: |-
              app.example.com wants you to sign in with your Ethereum account:
              0x71C7656EC7ab88b098defB751B7401B5f6d8976F

              Sign in.

              URI: https://app.example.com
              Version: 1
              Chain ID: 1
              Nonce: k3Jd9Xw2LmQp7Rt5Vb8Nc1Za
              Issued At: 2026-11-07T09:30:00.000Z
            signature: "0xababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
    responses:
      "200":
        description: The linked wallet.
        headers:
          X-Request-Id: *a1
          RateLimit-Limit: *a2
          RateLimit-Remaining: *a3
          RateLimit-Reset: *a4
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/identity.yaml#/Wallet
                - &a9
                  $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data: *a5
walletsMove:
  post:
    operationId: moveWallet
    summary: Move a wallet from another user to this one.
    description: A SIWE proof over a `move_wallet` nonce from the moving session. At most once per 30 days per wallet. The other user loses the wallet as if it had been unlinked.
    tags:
      - Auth
    x-owner: "03"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - siwe_invalid
      - wallet_move_cooldown
      - last_sign_in_method
      - second_factor_required
      - second_factor_invalid
    security: *a6
    parameters:
      - *a7
      - &a10
        $ref: ../components/headers.yaml#/SecondFactor
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/WalletProof
          example: *a8
    responses:
      "200":
        description: The moved wallet.
        headers:
          X-Request-Id: *a1
          RateLimit-Limit: *a2
          RateLimit-Remaining: *a3
          RateLimit-Reset: *a4
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/identity.yaml#/Wallet
                - *a9
            example:
              ok: true
              data: *a5
walletUnlink:
  post:
    operationId: unlinkWallet
    summary: Unlink a wallet.
    description: Never the last way to sign in. Connections made through the wallet are revoked.
    tags:
      - Auth
    x-owner: "03"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - last_sign_in_method
      - second_factor_required
      - second_factor_invalid
    security: *a6
    parameters:
      - *a7
      - name: walletId
        in: path
        required: true
        description: The wallet to unlink.
        schema:
          $ref: ../components/primitives.yaml#/Uuid
      - *a10
    responses:
      "200":
        description: Unlinked.
        headers:
          X-Request-Id: *a1
          RateLimit-Limit: *a2
          RateLimit-Remaining: *a3
          RateLimit-Reset: *a4
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/identity.yaml#/Empty
                - *a9
            example:
              ok: true
              data: {}
walletPayout:
  post:
    operationId: setPayoutWallet
    summary: Make a wallet the payout wallet.
    description: Starts the 7-day cooling-off, during which claims are refused and open claims are cancelled.
    tags:
      - Auth
    x-owner: "03"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - second_factor_required
      - second_factor_invalid
      - feature_unavailable
    security: *a6
    parameters:
      - *a7
      - name: walletId
        in: path
        required: true
        description: The wallet to pay out to.
        schema:
          $ref: ../components/primitives.yaml#/Uuid
      - *a10
    responses:
      "200":
        description: The wallet, now the payout wallet.
        headers:
          X-Request-Id: *a1
          RateLimit-Limit: *a2
          RateLimit-Remaining: *a3
          RateLimit-Reset: *a4
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/identity.yaml#/Wallet
                - *a9
            example:
              ok: true
              data: *a5
