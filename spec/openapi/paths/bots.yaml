botLogs:
  get:
    operationId: getBotLogs
    summary: Read the log lines of a bot.
    description: "The last lines the runner reported, oldest first."
    tags:
      - Lab
    x-owner: "09"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - feature_unavailable
      - not_found
    x-flag: bots.hosted
    security:
      - session: []
      - apiKey: []
    parameters:
      - name: botId
        in: path
        required: true
        description: The bot.
        schema:
          $ref: ../components/primitives.yaml#/Uuid
      - name: since
        in: query
        required: false
        description: The `next` of an earlier read.
        schema:
          type: string
          maxLength: 20
      - name: limit
        in: query
        required: false
        description: At most 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
    responses:
      "200":
        description: The answer, or a refusal.
        content:
          application/json:
            schema:
              type: object
              required:
                - ok
                - data
              properties:
                ok:
                  const: true
                data:
                  $ref: ../components/bots.yaml#/BotLogs
            example:
              ok: true
              data: { lines: [{ at: "2026-11-23T09:31:00.000Z", stream: out, text: started }], next: "1" }
