vault-index:
  parameters:
    - *vaultId
  get:
    operationId: getVaultIndex
    tags: [Vaults]
    summary: Read a vault's index chart.
    description: >-
      Index points from `from` to `to` at the given grain. The grain `minute` is allowed only for ranges of two days or
      less. A point with `stale: true` is drawn as a gap. The index is not streamed; the page polls every 60 seconds.
    x-owner: "12"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, not_found, invalid_request]
    security: []
    parameters:
      - name: from
        in: query
        required: true
        schema:
          $ref: ../components/primitives.yaml#/Instant
      - name: to
        in: query
        required: true
        schema:
          $ref: ../components/primitives.yaml#/Instant
      - name: grain
        in: query
        required: true
        schema:
          $ref: ../components/vaults.yaml#/VaultGrain
    responses:
      "200":
        description: The points, oldest first, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ok, data]
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/vaults.yaml#/VaultIndex
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                points:
                  - at: "2026-11-06T00:00:00.000Z"
                    index: "1.0801"
                    drawdown: "0.004"
                    stale: false
                  - at: "2026-11-07T00:00:00.000Z"
                    index: "1.0842"
                    drawdown: "0"
                    stale: false

vault-log:
  parameters:
    - *vaultId
  get:
    operationId: listVaultLog
    tags: [Vaults]
    summary: List a vault's public log, newest first.
    description: Public events, mandate breaches and guardian actions.
    x-owner: "12"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, not_found, cursor_invalid]
    security: []
    parameters:
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200":
        description: One page of log entries, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ok, data, nextCursor]
                  properties:
                    ok:
                      const: true
                    data:
                      type: array
                      items:
                        $ref: ../components/vaults.yaml#/VaultLogEntry
                    nextCursor:
                      type: [string, "null"]
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                - kind: guardian
                  at: "2026-11-05T14:00:00.000Z"
                  action: pause_openings
                  trigger: drawdown_stop
                  outcome: done
                - kind: breach
                  at: "2026-11-04T10:12:00.000Z"
                  breach: leverage_above_max
                  instrument: BTC-PERP
                  value: "6"
                  limit: "5"
                - kind: event
                  at: "2026-11-01T00:00:00.000Z"
                  event: vault.opened
                  data:
                    lpCount: 0
              nextCursor: null

vault-exposure:
  parameters:
    - *vaultId
  get:
    operationId: getVaultExposure
    tags: [Vaults]
    summary: Read a vault's positions by market.
    description: >-
      Positions older than the vault's privacy delay. A vault that shows metrics only refuses with `positions_private`.
    x-owner: "12"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, not_found, positions_private]
    security: []
    responses:
      "200":
        description: The exposure, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ok, data]
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/vaults.yaml#/VaultExposure
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                asOf: "2026-11-07T08:30:00.000Z"
                byMarket:
                  - instrument: BTC-PERP
                    side: long
                    notional: "62000"
                    shareOfNav: "0.496"

vault-records:
  parameters:
    - *vaultId
  get:
    operationId: listVaultRecords
    tags: [Vaults]
    summary: List the daily record hashes of a vault.
    description: >-
      One hash per vault account and day from `from_day` to `to_day`, so a depositor can check a record against the
      published hash (NAV-03). `vaultAccountRef` is an opaque ordinal of the vault.
    x-owner: "12"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, not_found, invalid_request]
    security: []
    parameters:
      - name: from_day
        in: query
        required: true
        schema:
          $ref: ../components/vaults.yaml#/VaultDay
      - name: to_day
        in: query
        required: true
        schema:
          $ref: ../components/vaults.yaml#/VaultDay
    responses:
      "200":
        description: The record hashes, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ok, data]
                  properties:
                    ok:
                      const: true
                    data:
                      type: array
                      items:
                        $ref: ../components/vaults.yaml#/VaultRecord
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                - vaultAccountRef: "1"
                  day: "2026-11-06"
                  sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

vault-matrix:
  get:
    operationId: getVaultMatrix
    tags: [Vaults]
    summary: Read the vault capability matrix.
    description: >-
      Every venue and kind with the verdict and evidence of each capability. A `yes_pending` cell is "to be proven" and
      names its probe or question.
    x-owner: "12"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable]
    security: []
    parameters:
      - $ref: ../components/parameters.yaml#/Venue
      - name: kind
        in: query
        required: false
        schema:
          $ref: ../components/vaults.yaml#/VaultKind
    responses:
      "200":
        description: The matrix, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ok, data]
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/vaults.yaml#/VaultMatrix
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                cells:
                  - *matrixCell
                rows:
                  - venue: hyperliquid
                    kind: option1
                    implementation: hl_native_multisig
                    readiness: one_time_setup
                    offered: false

my-vaults:
  get:
    operationId: getMyVaults
    tags: [Vaults]
    summary: Read the caller's vault seats, managed vaults and seat requests.
    description: >-
      The caller's accounts with their lots, open redemptions and statements; the vaults the caller manages; and the
      requests waiting for the caller's signature (read only in v1).
    x-owner: "12"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, unauthenticated]
    security:
      - session: []
      - apiKey: []
    responses:
      "200":
        description: The caller's vault state, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ok, data]
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/vaults.yaml#/MyVaults
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                accounts:
                  - vaultAccountId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d81
                    vaultId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                    seatRole: lp
                    status: active
                    nav: "1050.25"
                    navAt: "2026-11-07T09:30:00.000Z"
                    perfAccrued: "8.5"
                    lots:
                      - lotId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d82
                        amount: "1000"
                        units: "960.5"
                        mark: "1.0412"
                        creditedAt: "2026-10-20T00:00:00.000Z"
                        lockedUntil: "2026-10-27T00:00:00.000Z"
                    redemptionAddress: "0xfixtureaddress"
                    openRedemptions:
