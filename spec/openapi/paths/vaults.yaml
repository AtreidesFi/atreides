vault:
  parameters:
    - &vaultId
      name: id
      in: path
      required: true
      description: The vault's id, a UUIDv7. Another form is refused with `invalid_id`.
      schema:
        $ref: ../components/primitives.yaml#/Uuid
  get:
    operationId: getVault
    tags: [Vaults]
    summary: Read one vault with its terms.
    description: >-
      The summary, every term and risk parameter, the venue's matrix row, who can do what in this vault, the rule seat's
      hashes and the vault's state. Nothing about a term is hidden (LPR-01).
    x-owner: "12"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, not_found, invalid_id]
