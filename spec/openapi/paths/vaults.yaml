# The vault endpoints of v1 (12 §15.4.1): public reads of fixtures-only data behind `screens.vaults`, and the caller's own
# seats. The mutations of §15.4.2 are not mounted in v1. With the flag off every route answers `feature_unavailable`
# (VT-100). `/v1/vaults/matrix` and `/v1/vaults/mine` are static segments matched before `{id}`.
vaults:
  get:
    operationId: listVaults
    tags: [Vaults]
    summary: List vaults, newest first.
    description: >-
      Our vaults only, on every shelf. Without `status` the list leaves out vaults that are `created` or `closed`.
    x-owner: "12"
    x-scope: public
    x-rate-class: public
    x-idempotency: none
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, invalid_request, cursor_invalid]
    security: []
    parameters:
      - name: shelf
        in: query
        required: false
        schema:
          $ref: ../components/vaults.yaml#/VaultShelf
      - name: kind
        in: query
        required: false
        schema:
          $ref: ../components/vaults.yaml#/VaultKind
      - $ref: ../components/parameters.yaml#/Venue
      - name: status
        in: query
        required: false
        schema:
          $ref: ../components/vaults.yaml#/VaultStatus
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200":
        description: One page of vaults, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ok, data, nextCursor]
                  properties:
                    ok:
                      const: true
                    data:
                      type: array
                      items:
                        $ref: ../components/vaults.yaml#/VaultSummary
                    nextCursor:
                      type: [string, "null"]
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                - id: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  name: Fixture Balanced Perps
                  managerHandle: fixture_manager_1
                  kind: option1
                  cls: user
                  shelf: balanced
                  venue: hyperliquid
                  status: trading
                  tradingState: active
                  nav: "125000.5"
                  navAt: "2026-11-07T09:30:00.000Z"
                  index: "1.0842"
                  returnSinceStart: "0.0842"
                  return30d: "0.0213"
                  maxDrawdown: "0.0615"
                  sharpe90d: "1.37"
                  capacityCap: "500000"
                  capacityUsed: "125000.5"
                  managerStakeShare: "0.12"
                  lpCount: 14
                  historyDays: 142
                  verified: true
              nextCursor: null
  post:
    operationId: createVaultV1
    tags: [Vaults]
    summary: Create a vault with a reviewed mandate.
    x-owner: "12"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, invalid_request, not_found, forbidden, idempotency_conflict]
    security: [{ session: [] }]
    parameters:
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              type: object,
              additionalProperties: false,
              required: [mandate, name],
              properties:
                {
                  mandate: { $ref: ../components/vaults.yaml#/MandateDoc },
                  name: { type: string, minLength: 1, maxLength: 48 },
                },
            }
          example:
            {
              "mandate":
                {
                  "schema": "mandate/v1",
                  "kind": "option1",
                  "cls": "user",
                  "venue": "hyperliquid",
                  "instruments": ["BTC-PERP", "ETH-PERP"],
                  "maxLeverage": 5,
                  "maxPositionNotional": "100000",
                  "thinMarketCap": "0.02",
                  "drawdownStop": "0.2",
                  "managerStakeMin": "0.1",
                  "performanceFee": "0.2",
                  "platformShareOfPerformanceFee": "0.25",
                  "managementFee": "0",
                  "ourFeeCap": "0.0003",
                  "capacityCap": "500000",
                  "cashBuffer": "0.05",
                  "redemptionWindow": "daily",
                  "lockupMs": 604800000,
                  "minDeposit": "100",
                  "smallestOrderFraction": "0.001",
                  "noticePeriodMs": 1209600000,
                  "declaredActivity": { "maxQuietMs": 259200000, "windDownAfterMs": 1209600000 },
                  "tradingPath": "gateway",
                  "privacy": { "kind": "positions_delayed", "delayMs": 3600000 },
                  "shelf": "balanced",
                  "feeAddresses": { "manager": "0xfixturemanager", "platform": "0xfixtureplatform" },
                  "depegThreshold": "0.995",
                  "depositAsset": "usdc",
                },
              "name": "Fixture Balanced Perps",
            }
    responses:
      "200":
        description: The mutation result or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    additionalProperties: false,
                    required: [ok, data],
                    properties:
                      {
                        ok: { const: true },
                        data:
                          {
                            oneOf:
                              [
                                { $ref: ../components/vaults.yaml#/VaultDetail },
                                {
                                  type: array,
                                  items:
                                    {
                                      type: object,
                                      additionalProperties: false,
                                      required: [field, code, limit],
                                      properties:
                                        {
                                          field: { type: string },
                                          code: { type: string },
                                          limit: { type: [string, "null"] },
                                        },
