                    "sharpe90d": "1.37",
                    "capacityCap": "500000",
                    "capacityUsed": "125000.5",
                    "managerStakeShare": "0.12",
                    "lpCount": 14,
                    "historyDays": 142,
                    "verified": true,
                    "terms":
                      {
                        "mandateSha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08",
                        "mandate":
                          {
                            "schema": "mandate/v1",
                            "kind": "option1",
