    operationId: listOrders
    summary: List orders, newest first by `createdAt`.
    tags:
      - Orders
    x-owner: "03"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - cursor_invalid
      - account_not_bound
    x-mcp-tool:
      name: my_orders
      description: "List the user's orders and their state. An unknown order may have reached the venue; do not resend."
    security:
      - session: []
      - apiKey: []
    parameters:
      - $ref: ../components/parameters.yaml#/AccountId
      - $ref: ../components/parameters.yaml#/Venue
      - name: state
        in: query
        required: false
        description: Only orders in these states, as a comma list.
        schema:
          type: array
          items:
            $ref: ../components/primitives.yaml#/OrderState
        style: form
        explode: false
      - name: instrumentId
        in: query
        required: false
        description: Only this instrument.
        schema:
