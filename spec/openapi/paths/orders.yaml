# Orders and execution (03 §7.5). Sources only: no handlers.
orders:
  post:
    operationId: placeOrder
    summary: Place an order.
    description: An intent the gateway signs, or a relay payload the user's own key signed. A reduce-only order is
      rate-classed `protect` from its body, any other `order`. Sending the same `clientOrderId` with the same body
      returns the stored order. With `strategyRunId` the strategy run's refusals `strategy_run_not_live`,
      `strategy_killed` and `strategy_run_cap` also apply.
    tags:
      - Orders
    x-owner: "03"
    x-scope: trade
    x-rate-class: dynamic
    x-idempotency: client_order_id
    x-refusals:
      - terms_not_accepted
      - venue_closed
      - venue_reduce_only
      - venue_paused
      - kill_switch_active
      - rate_limited_account
      - fee_approval_missing
      - fee_code_missing
      - fee_above_cap
      - key_expiring
      - agent_expired
      - key_rights_refused
      - insufficient_margin
      - tick_size
      - lot_size
      - min_notional
      - price_band
      - stale_price
      - limit_exceeded
      - venue_rejected
      - unknown_outcome
      - not_placed
      - instrument_halted
      - relay_signer_mismatch
      - relay_refused
      - idempotency_conflict
      - account_not_bound
      - account_not_connected
      - relay_payload_invalid
      - strategy_run_not_live
      - strategy_killed
      - strategy_run_cap
      - route_no_candidate
      - routing_unavailable_testnet
      - insufficient_depth
      - route_requote
      - route_leg_invalid
      - route_not_live
      - not_found
      - feature_unavailable
      - order_type_unsupported
      - key_frozen
    x-forwards: true
    security:
      - session: []
      - apiKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/orders.yaml#/PlaceOrder
          example:
            accountId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d10
            clientOrderId: bot-7-000123
            instrumentId: hyperliquid:BTC
            side: buy
            type: limit
            tif: gtc
            price: "65000"
            size: "0.01"
            reduceOnly: false
    responses:
      "200":
        description: The order, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      oneOf:
                        - $ref: ../components/orders.yaml#/Order
                        - $ref: ../components/orders.yaml#/DryRunResult
                - $ref: ../components/envelope.yaml#/Refusal
                - type: object
                  required: [ok, data]
                  properties:
                    ok: { const: true }
                    data:
                      $ref: ../components/route.yaml#/Route
            example:
              ok: true
              data:
                orderId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d11
                routeId: null
                clientOrderId: bot-7-000123
                accountId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d10
                venue: hyperliquid
                instrumentId: hyperliquid:BTC
                cls: perp
                mode: gateway
                keyPlace: enclave
                origin: sdk
                side: buy
                type: limit
                tif: gtc
                price: "65000"
                size: "0.01"
                reduceOnly: false
                state: resting
                filledSize: "0"
                avgPrice: null
                venueOrderId: "184467"
                fee:
                  rate: "0.00025"
                  field: "builder: {b, f}"
                  asked: null
                reject: null
                finalReason: null
                unfilledByBand: null
                unknown: null
                userAction: null
                attached:
                  tp: null
                  sl: null
                executionReport: null
                createdAt: 2026-11-07T09:30:00.000Z
                updatedAt: 2026-11-07T09:30:05.000Z
