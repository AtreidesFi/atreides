                    - data
                    - nextCursor
                  properties:
                    ok:
                      const: true
                    data:
                      type: array
                      items:
                        $ref: ../components/orders.yaml#/Order
                    nextCursor:
                      type:
                        - string
                        - "null"
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                - orderId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d11
                  routeId: null
                  clientOrderId: bot-7-000123
                  accountId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d10
                  venue: hyperliquid
