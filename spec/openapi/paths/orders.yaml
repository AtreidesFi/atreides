                  price: "65000"
                  size: "0.01"
                  reduceOnly: false
                  state: resting
                  filledSize: "0"
                  avgPrice: null
                  venueOrderId: "184467"
                  fee:
                    rate: "0.00025"
                    field: "builder: {b, f}"
                    asked: null
                  reject: null
                  finalReason: null
                  unfilledByBand: null
                  unknown: null
                  userAction: null
