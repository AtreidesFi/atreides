check:
  get:
    operationId: preSignCheck
    summary: Ask the gateway whether an order may be signed on the device.
    description:
      The gateway's pre-sign answer a device-signed page asks for. Writes the pending row, idempotent by account
      and client order id (a GET, so `x-idempotency` is none).
    tags:
      - Orders
    x-owner: "03"
    x-scope: trade
    x-rate-class: order
    x-idempotency: none
    x-refusals:
      - venue_closed
      - venue_reduce_only
      - venue_paused
      - kill_switch_active
      - rate_limited_account
      - fee_approval_missing
      - fee_code_missing
      - fee_above_cap
      - key_expiring
      - agent_expired
      - key_rights_refused
      - insufficient_margin
      - tick_size
      - lot_size
      - min_notional
      - price_band
      - stale_price
      - limit_exceeded
      - venue_rejected
      - unknown_outcome
      - not_placed
      - instrument_halted
      - relay_signer_mismatch
      - relay_refused
      - idempotency_conflict
      - account_not_bound
      - account_not_connected
      - relay_payload_invalid
      - feature_unavailable
    x-forwards: true
    security:
      - session: []
      - apiKey: []
    parameters:
      - name: accountId
        in: query
        required: true
        description: The venue account. A key bound to other accounts is refused with `account_not_bound`.
        schema:
          $ref: ../components/primitives.yaml#/Uuid
      - name: clientOrderId
        in: query
        required: true
        description: The id the order will carry.
        schema:
          $ref: ../components/primitives.yaml#/ClientOrderId
      - name: instrumentId
        in: query
        required: true
        description: The instrument.
        schema:
          type: string
      - name: side
        in: query
        required: true
        description: Buy or sell.
        schema:
          type: string
          enum:
            - buy
            - sell
      - name: type
        in: query
        required: true
        description: Order type.
        schema:
          type: string
          enum:
            - limit
            - market
      - name: size
        in: query
        required: true
        description: The size.
        schema:
          $ref: ../components/primitives.yaml#/DecStr
      - name: price
        in: query
        required: false
        description: The limit price.
        schema:
          $ref: ../components/primitives.yaml#/DecStr
      - name: reduceOnly
        in: query
        required: true
        description: Whether the order only reduces a position.
        schema:
          type: boolean
    responses:
      "200":
        description: The gateway's answer.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/orders.yaml#/PreSignCheck
