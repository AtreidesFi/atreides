                    maxOrdersPerDay: 10
                    maxLeverage: 1
                  quoteAsset: usdc
                  runner: null
                  stats: null
                  createdAt: "2026-11-07T09:30:00.000Z"
                  startedAt: null
                  stoppedAt: null
              nextCursor: null
