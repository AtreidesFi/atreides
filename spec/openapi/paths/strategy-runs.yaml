# Strategy runs and runner reports (09 §6.2).
create:
  post:
    operationId: createStrategyRun
    summary: Create a strategy run.
    tags:
      - Lab
    x-owner: "09"
    x-scope: read
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - account_not_bound
      - scope_missing
      - venue_closed
      - venue_reduce_only
      - venue_paused
      - strategy_killed
      - strategy_archived
      - lab_spec_invalid
      - strategy_run_caps_invalid
      - strategy_run_limit
      - account_not_owned
      - feature_unavailable
      - idempotency_conflict
    x-flag: strategies.enabled
    security:
      - session: []
      - apiKey: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: ../components/primitives.yaml#/Uuid
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/lab-runs.yaml#/CreateStrategyRunRequest
          example:
            versionId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
            mode: paper
            caps:
              instruments:
                - hyperliquid:BTC
              maxOrderNotional: "100"
              maxOpenNotional: "200"
              maxOpenPositions: 2
              dailyLossStop: "0.1"
              maxOrdersPerDay: 10
              maxLeverage: 1
    responses:
      "200":
        description: The answer, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/lab-runs.yaml#/StrategyRunCreated
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                run:
                  id: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  strategyId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  strategyNumber: 1
                  versionId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  version: 1
                  mode: paper
                  venueAccountId: null
                  status: armed
                  pauseReason: null
                  stopPolicy: null
                  caps:
                    instruments:
                      - hyperliquid:BTC
                    maxOrderNotional: "100"
                    maxOpenNotional: "200"
                    maxOpenPositions: 2
                    dailyLossStop: "0.1"
                    maxOrdersPerDay: 10
                    maxLeverage: 1
                  quoteAsset: usdc
                  runner: null
                  stats: null
                  createdAt: "2026-11-07T09:30:00.000Z"
                  startedAt: null
                  stoppedAt: null
                runnerSnippet:
                  ts: const runId = "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80"
                  python: run_id = "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80"
list:
  get:
    operationId: listStrategyRuns
    summary: List the caller's strategy runs.
    tags:
      - Lab
    x-owner: "09"
    x-scope: read
    x-rate-class: read
    x-idempotency: none
    x-refusals:
      - feature_unavailable
    x-flag: strategies.enabled
    security:
      - session: []
      - apiKey: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - armed
            - live
            - paused
            - lost
            - stopping
            - stopped
            - failed
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
            - paper
            - direct
            - gateway
      - name: strategyId
        in: query
        required: false
        schema:
          $ref: ../components/primitives.yaml#/Uuid
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200":
        description: The answer, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - ok
                    - data
                    - nextCursor
                  properties:
                    ok:
                      const: true
                    data:
                      type: array
                      items:
                        $ref: ../components/lab.yaml#/RunView
                    nextCursor:
                      oneOf:
                        - type: string
                        - type: "null"
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              ok: true
              data:
                - id: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  strategyId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
