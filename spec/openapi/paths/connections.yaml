disconnect:
  parameters:
    - *a10
  post:
    operationId: disconnectConnection
    summary: "Disconnect: destroy our copy of the key at once and say where the venue lists it."
    description: "A brake: never frozen by a venue state."
    tags:
      - Accounts
    x-owner: "03"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - idempotency_conflict
    security: *a4
    parameters:
      - *a11
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/connections.yaml#/DisconnectRequest
          example:
            cancelOpenOrders: true
    responses:
      "200":
        description: The result, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/connections.yaml#/DisconnectResult
                - *a1
            example:
              ok: true
              data:
                connection:
                  connectionId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                  accountId: 01936f2e-7c3b-7c2f-9e5a-3b0d6f7c8e91
                  venue: hyperliquid
                  mode: gateway
                  keyPlace: signer
                  state: revoked
                  stateReason: null
                  key: *a12
                  approval: *a13
                  custodyNote: The key can trade; it cannot withdraw. Funds move only with your own wallet signature.
                  venueExtra: *a14
                  createdAt: 2026-11-07T09:30:00.000Z
                  updatedAt: 2026-11-07T09:30:00.000Z
                venueKeyPage: https://app.hyperliquid.xyz/API
                venueStillLists: null
