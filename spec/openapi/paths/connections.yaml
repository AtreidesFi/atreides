    summary: Start renewing a connection's key.
    tags:
      - Accounts
    x-owner: "03"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-refusals:
      - connection_state
      - idempotency_conflict
    security: *a4
    parameters:
      - *a11
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/connections.yaml#/RenewRequest
          example: {}
    responses:
      "200":
        description: The result, or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - ok
                    - data
                  properties:
                    ok:
                      const: true
                    data:
                      $ref: ../components/connections.yaml#/ConnectOffer
                - *a1
            example:
              ok: true
              data:
                offerId: 01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80
                venue: hyperliquid
                kind: renew_key
                mode: gateway
                keyPlace: signer
                accountRef: "0x1111111111111111111111111111111111111111"
                status: open
                steps: *a7
                key: *a8
                sealTo: null
                validUntil: 2026-11-07T09:30:05.000Z
                venueExtra: *a9
recheck:
