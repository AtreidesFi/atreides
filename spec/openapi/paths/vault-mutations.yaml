deposit:
  post:
    operationId: openVaultDepositV1
    tags: [Vaults]
    summary: Get a bounded vault deposit instruction.
    x-owner: "12"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, invalid_request, not_found, forbidden, idempotency_conflict]
    security: [{ session: [] }]
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { $ref: ../components/primitives.yaml#/Uuid }
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              type: object,
              additionalProperties: false,
              required: [amount],
              properties: { amount: { $ref: ../components/primitives.yaml#/DecStr } },
            }
          example: { "amount": "100" }
    responses:
      "200":
        description: The mutation result or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    additionalProperties: false,
                    required: [ok, data],
                    properties:
                      {
                        ok: { const: true },
                        data:
                          {
                            type: object,
                            additionalProperties: false,
                            required: [depositId, expiresAt, instruction],
                            properties:
                              {
                                depositId: { $ref: ../components/primitives.yaml#/Uuid },
                                expiresAt: { $ref: ../components/primitives.yaml#/Instant },
                                instruction: { type: object, additionalProperties: {} },
                              },
                          },
                      },
                  }
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              {
                "ok": true,
                "data":
                  {
                    "depositId": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d91",
                    "instruction": { "asset": "usdc", "amount": "100" },
                    "expiresAt": "2026-11-15T13:00:00.000Z",
                  },
              }

redemption:
  post:
    operationId: openVaultRedemptionV1
    tags: [Vaults]
    summary: Request a vault redemption to the recorded LP address.
    x-owner: "12"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, invalid_request, not_found, forbidden, idempotency_conflict]
    security: [{ session: [] }]
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { $ref: ../components/primitives.yaml#/Uuid }
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              oneOf:
                [
                  {
                    type: object,
                    additionalProperties: false,
                    required: [amount],
                    properties: { amount: { $ref: ../components/primitives.yaml#/DecStr } },
                  },
                  { type: object, additionalProperties: false, required: [all], properties: { all: { const: true } } },
                ],
            }
          example: { "all": true }
    responses:
      "200":
        description: The mutation result or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    additionalProperties: false,
                    required: [ok, data],
                    properties:
                      {
                        ok: { const: true },
                        data:
                          {
                            type: object,
                            additionalProperties: false,
                            required: [redemptionId, plan],
                            properties:
                              {
                                redemptionId: { $ref: ../components/primitives.yaml#/Uuid },
                                plan: { $ref: ../components/vaults.yaml#/VaultRedemptionPlan },
                              },
                          },
                      },
                  }
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              {
                "ok": true,
                "data":
                  {
                    "redemptionId": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d92",
                    "plan":
                      {
                        "path": "queued",
                        "lots": [{ "lotId": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d82", "units": "240" }],
                        "fraction": "0.25",
                        "deadlineAt": "2026-11-17T12:00:00.000Z",
                        "capped": false,
                      },
                  },
              }

