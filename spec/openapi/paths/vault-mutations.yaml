# Vault-track mutations (12 §15.4.2). The runtime mounts these only with the V1 vault role bindings.
notice:
  post:
    operationId: giveVaultNoticeV1
    tags: [Vaults]
    summary: Start the vault notice period.
    x-owner: "12"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, invalid_request, not_found, forbidden, idempotency_conflict]
    security: [{ session: [] }]
    parameters:
      - name: vaultId
        in: path
        required: true
        schema: { $ref: ../components/primitives.yaml#/Uuid }
      - $ref: ../components/headers.yaml#/IdempotencyKey
    responses:
      "200":
        description: The mutation result or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    additionalProperties: false,
                    required: [ok, data],
                    properties:
                      {
                        ok: { const: true },
                        data:
                          {
                            type: object,
                            additionalProperties: false,
                            required: [noticeEndsAt],
                            properties: { noticeEndsAt: { $ref: ../components/primitives.yaml#/Instant } },
                          },
                      },
                  }
                - $ref: ../components/envelope.yaml#/Refusal
            example: { "ok": true, "data": { "noticeEndsAt": "2026-11-29T12:00:00.000Z" } }

accounts:
  post:
    operationId: openVaultAccountV1
    tags: [Vaults]
    summary: Request a vault account for the signed-in wallet owner.
    x-owner: "12"
    x-scope: session
    x-rate-class: connect
    x-idempotency: header
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, invalid_request, not_found, forbidden, idempotency_conflict]
    security: [{ session: [] }]
    parameters:
      - name: vaultId
        in: path
        required: true
        schema: { $ref: ../components/primitives.yaml#/Uuid }
      - $ref: ../components/headers.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              type: object,
              additionalProperties: false,
              required: [walletId, redemptionAddress],
              properties:
                {
                  walletId: { $ref: ../components/primitives.yaml#/Uuid },
                  redemptionAddress: { type: string, minLength: 1 },
                },
            }
          example:
            { "walletId": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d93", "redemptionAddress": "fixture-redemption-address" }
    responses:
      "200":
        description: The mutation result or a refusal.
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    additionalProperties: false,
                    required: [ok, data],
                    properties: { ok: { const: true }, data: { $ref: ../components/vaults.yaml#/MyVaultAccount } },
                  }
                - $ref: ../components/envelope.yaml#/Refusal
            example:
              {
                "ok": true,
                "data":
                  {
                    "vaultAccountId": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d81",
                    "vaultId": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80",
                    "seatRole": "lp",
                    "status": "proposed",
                    "nav": "1050.25",
                    "navAt": "2026-11-07T09:30:00.000Z",
                    "perfAccrued": "8.5",
                    "lots":
                      [
                        {
                          "lotId": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d82",
                          "amount": "1000",
                          "units": "960.5",
                          "mark": "1.0412",
                          "creditedAt": "2026-10-20T00:00:00.000Z",
                          "lockedUntil": "2026-10-27T00:00:00.000Z",
                        },
                      ],
                    "redemptionAddress": "0xfixtureaddress",
                    "openRedemptions":
                      [
                        {
                          "id": "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d83",
                          "status": "queued",
                          "path": "queued",
                          "net": "250",
                          "deadlineAt": "2026-11-09T00:00:00.000Z",
