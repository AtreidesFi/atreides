    operationId: placeVaultOrderV1
    tags: [Vaults]
    summary: Place vault orders as the approved manager.
    x-owner: "12"
    x-scope: trade
    x-rate-class: dynamic
    x-idempotency: client_order_id
    x-flag: screens.vaults
    x-refusals: [feature_unavailable, invalid_request, not_found, forbidden, idempotency_conflict]
    security: [{ apiKey: [] }]
    parameters:
      - name: vaultId
        in: path
        required: true
        schema: { $ref: ../components/primitives.yaml#/Uuid }
    requestBody:
      required: true
