# Lab runs, results and read-only venue data (09 §6.2).
runs:
  get:
    operationId: "listLabRuns"
    summary: "List owned lab runs."
    tags: ["Lab"]
    x-owner: "09"
    x-scope: "read"
    x-rate-class: "read"
    x-idempotency: "none"
    x-refusals: []
    security: [{ "session": [] }, { "apiKey": [] }]
    parameters:
      [
        {
          "name": "strategyId",
          "in": "query",
          "required": false,
          "schema": { "$ref": "../components/primitives.yaml#/Uuid" },
        },
        {
          "name": "status",
          "in": "query",
          "required": false,
          "schema": { "type": "string", "enum": ["queued", "running", "done", "failed", "cancelled", "refused"] },
        },
        { "$ref": "../components/parameters.yaml#/Cursor" },
        { "$ref": "../components/parameters.yaml#/Limit" },
      ]
    responses:
      "200":
        description: "The answer, or a refusal."
        content:
          application/json:
            schema:
              type: "object"
              required: ["ok", "data", "nextCursor"]
              properties:
                ok:
                  const: true
                data:
                  type: "array"
                  items:
                    $ref: "../components/lab.yaml#/LabRunView"
                nextCursor:
                  type: ["string", "null"]
            example:
              ok: true
              data: []
              nextCursor: null
  post:
    operationId: "createLabRun"
    summary: "Admit a backtest."
    tags: ["Lab"]
    x-owner: "09"
    x-scope: "read"
    x-rate-class: "heavy"
    x-idempotency: "header"
    x-refusals:
      [
        "lab_data_gap",
        "lab_venue_not_ready",
        "lab_venue_not_licensed",
        "lab_fee_model_missing",
        "lab_too_many_runs",
        "lab_run_too_large",
        "lab_spec_invalid",
        "feature_unavailable",
        "idempotency_conflict",
      ]
    description: "Lab writes accept a session or an ed25519 key with read scope."
    x-flag: "lab.enabled"
    security: [{ "session": [] }, { "apiKey": [] }]
    parameters: [{ "$ref": "../components/headers.yaml#/IdempotencyKey" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/lab.yaml#/LabRunParams"
          example:
            kind: "backtest"
            strategyVersionId: "01936f2e-7c3b-7b1e-8d4f-2a9c5e6b7d81"
            from: "2026-11-07T09:30:00.000Z"
            to: "2026-11-08T09:30:00.000Z"
    responses:
      "200":
        description: "The answer, or a refusal."
        content:
          application/json:
            schema:
              oneOf:
                [
                  {
                    "type": "object",
                    "required": ["ok", "data"],
                    "properties":
                      { "ok": { "const": true }, "data": { "$ref": "../components/lab.yaml#/LabRunCreated" } },
                  },
                  { "$ref": "../components/envelope.yaml#/Refusal" },
                ]
            example:
              ok: true
              data:
                run:
                  id: "01936f2e-7c3a-7b1e-8d4f-2a9c5e6b7d80"
                  kind: "backtest"
                  status: "queued"
                  strategyId: null
                  strategyNumber: null
                  versionId: "01936f2e-7c3b-7b1e-8d4f-2a9c5e6b7d81"
                  version: 1
                  params: null
                  plan: null
                  progress:
                    permille: 0
                    stage: "queued"
                    etaAt: null
                  queuePosition: 0
                  cachedFromRunId: null
                  bestResultId: null
                  error: null
                  createdAt: "2026-11-07T09:30:00.000Z"
                  startedAt: null
                  finishedAt: null
                plan:
                  instruments: ["hyperliquid:BTC"]
                  variants: 1
                  bars: 1440
                  window:
                    from: 1794043800000
                    to: 1794130200000
                    trainEnd: 1794104280000
                  trimmedFrom: null
                  holes: []
                  estimateMs: 2000
                cachedFrom: null
